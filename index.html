<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>Peasd Ariky</title>

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* ВАЖНО: скрываем первый paint полностью */
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: var(--app-height);

    overflow: hidden;
    background: #000;

    position: relative;

    overscroll-behavior: none;
    touch-action: none;

    opacity: 0; /* КЛЮЧЕВОЙ ФИКС */
    transition: opacity 0.2s ease;
}

.game-container {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: var(--app-height);

    overflow: hidden;
    background: #000;
}

.bg-img {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    z-index: 1;
}

#unity-canvas {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: block;
    background: #000;
    z-index: 2;
}

#loader-wrapper {
    position: absolute;
    top: 50%;
    left: 25%;
    width: 50%;
    height: 60px;

    transform: translateY(-50%);
    background: rgba(0,0,0,0.3);
    border-radius: 15px;

    overflow: hidden;
    z-index: 3;
}

#progress-bar {
    width: 0%;
    height: 100%;
    background: #8a00ff;
    transition: width 0.3s ease;
}

</style>
</head>

<body>

<div class="game-container">

    <img src="Preview.png" class="bg-img">

    <div id="loader-wrapper">
        <div id="progress-bar"></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

</div>

<script src="Build/Peasd Ariky.loader.js"></script>

<script>

const canvas = document.querySelector("#unity-canvas");
const progressBar = document.querySelector("#progress-bar");
const container = document.querySelector(".game-container");

/* ---------------- viewport ---------------- */

function setAppHeight() {

    const h =
        window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;

    document.documentElement.style.setProperty('--app-height', h + 'px');
}

/* ---------------- canvas ---------------- */

function resizeCanvas() {

    const w =
        window.visualViewport
            ? window.visualViewport.width
            : window.innerWidth;

    const h =
        window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;

    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
}

/* ---------------- HARD STABLE GATE ---------------- */

function waitStableViewport(cb) {

    let last = window.visualViewport?.height || window.innerHeight;
    let stable = 0;

    function tick() {

        const h = window.visualViewport?.height || window.innerHeight;

        if (Math.abs(h - last) < 2) stable++;
        else stable = 0;

        last = h;

        if (stable > 10) {

            /* ВАЖНО: даём Safari 2 repaint цикла */
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    setTimeout(cb, 100);
                });
            });

        } else {
            requestAnimationFrame(tick);
        }
    }

    tick();
}

/* ---------------- listeners ---------------- */

function bind() {

    setAppHeight();
    resizeCanvas();

    window.addEventListener('resize', () => {
        setAppHeight();
        resizeCanvas();
    });

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            setAppHeight();
            resizeCanvas();
        });

        window.visualViewport.addEventListener('scroll', resizeCanvas);
    }

    window.addEventListener('orientationchange', () => {
        setTimeout(setAppHeight, 50);
        setTimeout(resizeCanvas, 50);

        setTimeout(setAppHeight, 200);
        setTimeout(resizeCanvas, 200);
    });
}

/* ---------------- unity ---------------- */

const config = {

    dataUrl: "Build/Peasd Ariky.data",
    frameworkUrl: "Build/Peasd Ariky.framework.js",

    codeUrl: "Build/Peasd Ariky.wasm",

    streamingAssetsUrl: "StreamingAssets",
    companyName: "DeshaCompany",
    productName: "Peasd Ariky",
    productVersion: "0.3",

    matchWebGLToCanvasSize: true,
    devicePixelRatio: window.devicePixelRatio || 1
};

/* ---------------- BOOT ---------------- */

setAppHeight();
resizeCanvas();

/* главный фикс */
waitStableViewport(() => {

    bind();

    /* показываем только после полного стабильного frame */
    document.body.style.opacity = "1";

    container.style.opacity = "1";

    createUnityInstance(canvas, config, (progress) => {

        progressBar.style.width = Math.floor(progress * 100) + "%";

    }).then(() => {

        const bg = document.querySelector(".bg-img");
        const loader = document.querySelector("#loader-wrapper");

        if (bg) bg.style.opacity = "0";

        setTimeout(() => {
            if (bg) bg.remove();
            if (loader) loader.remove();
        }, 500);

    });

});

</script>

</body>
</html>
