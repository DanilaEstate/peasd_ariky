<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>Peasd Ariky</title>

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* ВАЖНО: нет viewport-based height вообще */
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
    background: #000;

    position: fixed; /* фикс Safari bug */

    opacity: 0; /* блок первого paint */
}

/* КЛЮЧЕВОЕ ИЗМЕНЕНИЕ */
.game-container {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    /* вместо <img> */
    background: url("Preview.png") center center / cover no-repeat;
}

#unity-canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background: #000;
    z-index: 2;
}

#loader-wrapper {
    position: absolute;
    top: 50%;
    left: 25%;
    width: 50%;
    height: 60px;

    transform: translateY(-50%);
    background: rgba(0,0,0,0.3);
    border-radius: 15px;

    overflow: hidden;
    z-index: 3;
}

#progress-bar {
    width: 0%;
    height: 100%;
    background: #8a00ff;
    transition: width 0.3s ease;
}

</style>
</head>

<body>

<div class="game-container">

    <div id="loader-wrapper">
        <div id="progress-bar"></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

</div>

<script src="Build/Peasd Ariky.loader.js"></script>

<script>

const canvas = document.querySelector("#unity-canvas");
const progressBar = document.querySelector("#progress-bar");
const body = document.body;

/* ---------------- SAFE START (CRITICAL) ---------------- */

function waitFirstStablePaint(cb) {

    let last = window.innerHeight;
    let stable = 0;

    function tick() {

        const h = window.innerHeight;

        if (Math.abs(h - last) < 2) stable++;
        else stable = 0;

        last = h;

        if (stable > 12) {

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    setTimeout(cb, 150);
                });
            });

        } else {
            requestAnimationFrame(tick);
        }
    }

    tick();
}

/* ---------------- canvas resize (minimal) ---------------- */

function resizeCanvas() {

    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
}

/* ---------------- UNITY ---------------- */

const config = {

    dataUrl: "Build/Peasd Ariky.data",
    frameworkUrl: "Build/Peasd Ariky.framework.js",

    codeUrl: "Build/Peasd Ariky.wasm",

    streamingAssetsUrl: "StreamingAssets",
    companyName: "DeshaCompany",
    productName: "Peasd Ariky",
    productVersion: "0.3",

    matchWebGLToCanvasSize: true,
    devicePixelRatio: window.devicePixelRatio || 1
};

/* ---------------- BOOT ---------------- */

waitFirstStablePaint(() => {

    resizeCanvas();

    body.style.opacity = "1";

    createUnityInstance(canvas, config, (progress) => {

        progressBar.style.width = Math.floor(progress * 100) + "%";

    }).then(() => {

        const loader = document.querySelector("#loader-wrapper");

        setTimeout(() => {
            if (loader) loader.remove();
        }, 400);

    });

});

</script>

</body>
</html>
