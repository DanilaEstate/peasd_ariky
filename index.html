<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      body {
        position: fixed;
        inset: 0;
      }

      :root {
        --safe-top: 0px;
      }

      .game-container {
        position: fixed;
        inset: 0;
        background: black;
        overflow: hidden;
        padding-top: var(--safe-top);
      }

      /* Unity ВСЕГДА fullscreen внутри контейнера */
      #unity-canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
        z-index: 2;
      }

      .bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transition: opacity 0.5s ease;
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0,0,0,0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transform: translateY(-50%);
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
      }
    </style>

    <script>
      function updateSafeArea() {
        const isPortrait = window.innerHeight > window.innerWidth;

        let safeTop = 0;

        if (isPortrait) {
          const style = getComputedStyle(document.documentElement)
            .getPropertyValue('env(safe-area-inset-top)');

          safeTop = parseInt(style) || 0;

          if (safeTop < 20) safeTop = 47; // iPhone fallback
        }

        document.documentElement.style.setProperty('--safe-top', safeTop + 'px');
      }

      window.addEventListener('resize', updateSafeArea);
      window.addEventListener('orientationchange', () => {
        setTimeout(updateSafeArea, 150);
        setTimeout(updateSafeArea, 400);
      });

      updateSafeArea();
    </script>
  </head>

  <body>
    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const progressBar = document.querySelector("#progress-bar");

      const config = {
        dataUrl: "Build/Peasd Ariky.data",
        frameworkUrl: "Build/Peasd Ariky.framework.js",
        codeUrl: "Build/Peasd Ariky.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.3",
      };

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";
        if (progress >= 1) progressBar.style.opacity = "0";
      }).then((unityInstance) => {
        document.querySelector(".bg-img").remove();
        document.querySelector("#loader-wrapper").remove();

        window.focus();
        canvas.focus();
      }).catch(alert);
    </script>
  </body>
</html>
