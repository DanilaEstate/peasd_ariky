<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
      :root {
        --safe-top: 0px;
        --app-height: 100vh;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        position: fixed;
      }

      body {
        width: 100vw;
        height: 100vh;
      }

      .top-safe-area {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--safe-top);
        background: #000;
        z-index: 9999;
        pointer-events: none;
      }

      .game-container {
        position: fixed;
        top: var(--safe-top);
        left: 0;
        width: 100vw;
        height: calc(var(--app-height) - var(--safe-top));
        overflow: hidden;
        background: #000;
      }

      .bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;

        transform-origin: left center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;

        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.7); }
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;

        background: rgba(0,0,0,0.3);
        border-radius: 15px;

        overflow: hidden;
        z-index: 3;

        transform: translateY(-50%);
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.3s ease;
      }

      #unity-canvas {
        position: absolute;
        inset: 0;

        width: 100% !important;
        height: 100% !important;

        display: block;
        z-index: 2;

        object-fit: fill;
        background: transparent;
      }
    </style>

    <script>
      function updateViewport() {
        const vv = window.visualViewport;

        const viewportHeight = vv ? vv.height : window.innerHeight;

        let safeTop = 0;

        if (CSS.supports('top: env(safe-area-inset-top)')) {
          safeTop = parseFloat(
            getComputedStyle(document.documentElement)
              .getPropertyValue('--sat') || 0
          );
        }

        const computedSafeTop = parseInt(
          getComputedStyle(document.documentElement)
            .getPropertyValue('padding-top')
        ) || 0;

        safeTop = Math.max(
          safeTop,
          computedSafeTop,
          44
        );

        document.documentElement.style.setProperty(
          '--safe-top',
          safeTop + 'px'
        );

        document.documentElement.style.setProperty(
          '--app-height',
          viewportHeight + 'px'
        );
      }

      window.addEventListener('resize', updateViewport);
      window.addEventListener('orientationchange', () => {
        setTimeout(updateViewport, 50);
        setTimeout(updateViewport, 300);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateViewport);
      }

      document.addEventListener('DOMContentLoaded', updateViewport);
    </script>
  </head>

  <body>
    <div class="top-safe-area"></div>

    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var config = {
        dataUrl: "Build/Peasd Ariky.data",
        frameworkUrl: "Build/Peasd Ariky.framework.js",
        codeUrl: "Build/Peasd Ariky.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.3",
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');

        meta.name = 'viewport';
        meta.content =
          'width=device-width,' +
          'height=device-height,' +
          'initial-scale=1.0,' +
          'maximum-scale=1.0,' +
          'user-scalable=no,' +
          'viewport-fit=cover';

        document.head.appendChild(meta);
      }

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width =
          Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {

        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        updateViewport();

        setTimeout(() => {
          updateViewport();
        }, 100);

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);

      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
