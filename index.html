<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>Peasd Ariky</title>

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<style>

/* ---------------- RESET ---------------- */

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* ---------------- KEY FIX ---------------- */
/* фиксируем РЕАЛЬНУЮ высоту viewport */
:root {
    --vh: 1vh;
}

/* ---------------- GAME ROOT ---------------- */

.game-container {
    position: fixed;

    left: 0;
    right: 0;

    top: 0;

    /* 🔥 ВАЖНО: привязка к НИЗУ экрана */
    bottom: 0;

    height: calc(var(--vh) * 100);

    background: #000;
    overflow: hidden;
}

/* ---------------- PREVIEW ---------------- */

.bg-img {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    transform-origin: left center;
}

/* ---------------- UNITY ---------------- */

#unity-canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
    background: #000;
    z-index: 2;
}

/* ---------------- LOADER ---------------- */

#loader-wrapper {
    position: absolute;
    top: 50%;
    left: 25%;
    width: 50%;
    height: 60px;

    transform: translateY(-50%);
    background: rgba(0,0,0,0.3);
    border-radius: 15px;

    overflow: hidden;
    z-index: 3;
}

#progress-bar {
    width: 0%;
    height: 100%;
    background: #8a00ff;
    transition: width 0.3s ease;
}

</style>
</head>

<body>

<div class="game-container">

    <img src="Preview.png" class="bg-img">

    <div id="loader-wrapper">
        <div id="progress-bar"></div>
    </div>

    <canvas id="unity-canvas"></canvas>

</div>

<script src="Build/Peasd Ariky.loader.js"></script>

<script>

const canvas = document.querySelector("#unity-canvas");
const progressBar = document.querySelector("#progress-bar");

/* ---------------- CRITICAL FIX: ALWAYS KEEP TOP SAFE AREA ---------------- */

function updateVH() {
    const h = window.visualViewport?.height || window.innerHeight;
    document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
}

/* ---------------- LOCK LAYOUT ---------------- */

function lockLayout() {

    updateVH();

    window.addEventListener("resize", updateVH);

    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateVH);
        window.visualViewport.addEventListener("scroll", updateVH);
    }

    window.addEventListener("orientationchange", () => {
        setTimeout(updateVH, 100);
        setTimeout(updateVH, 300);
        setTimeout(updateVH, 600);
    });
}

/* ---------------- UNITY ---------------- */

const config = {
    dataUrl: "Build/Peasd Ariky.data",
    frameworkUrl: "Build/Peasd Ariky.framework.js",
    codeUrl: "Build/Peasd Ariky.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DeshaCompany",
    productName: "Peasd Ariky",
    productVersion: "0.3",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: window.devicePixelRatio || 1
};

/* ---------------- BOOT ---------------- */

/* важно: сначала фиксируем layout */
lockLayout();

createUnityInstance(canvas, config, (progress) => {
    progressBar.style.width = Math.floor(progress * 100) + "%";
}).then(() => {

    const bg = document.querySelector(".bg-img");
    const loader = document.querySelector("#loader-wrapper");

    if (bg) bg.style.opacity = "0";

    setTimeout(() => {
        if (bg) bg.remove();
        if (loader) loader.remove();
    }, 500);

});

</script>

</body>
</html>
