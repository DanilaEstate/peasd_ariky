<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
     html, body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;
        background: #000;

        overscroll-behavior: none;
        touch-action: none;
    }

    body {
        position: fixed;

        inset: 0;

        /* КРИТИЧНО ДЛЯ IPHONE */
        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }

    .game-container {
        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        /* НОВЫЕ viewport units для iOS */
        height: 100dvh;
        min-height: -webkit-fill-available;

        overflow: hidden;

        background: #000;
    }

        .bg-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            transform-origin: left center; 
            transition: opacity 0.5s ease;
        }

      #unity-canvas {
          position: absolute;
          inset: 0;

          width: 100%;
          height: 100%;

          display: block;

          object-fit: cover;

          background: #000;
      }

        #loader-wrapper {
            position: absolute; top: 50%; left: 25%; width: 50%;
            height: 60px; background: rgba(0, 0, 0, 0.3);
            border-radius: 15px; overflow: hidden; z-index: 3;
            transform: translateY(-50%);
        }

        #progress-bar {
            width: 0%; height: 100%; background: #8a00ff; transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <img src="Preview.png" class="bg-img">
        <div id="loader-wrapper">
            <div id="progress-bar"></div>
        </div>
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var progressBar = document.querySelector("#progress-bar");

       function fixGeometry() {}

        window.addEventListener('resize', fixGeometry);
        window.addEventListener('orientationchange', () => setTimeout(fixGeometry, 200));

        var config = {
            dataUrl: "Build/Peasd Ariky.data",
            frameworkUrl: "Build/Peasd Ariky.framework.js",
            codeUrl: "Build/Peasd Ariky.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DeshaCompany",
            productName: "Peasd Ariky",
            productVersion: "0.3",
            
            // Заставляем Unity адаптироваться к размерам канваса, растянутого через object-fit: cover
            matchWebGLToCanvasSize: false, 
            
            // ВАЖНО ДЛЯ ЧЕТКОСТИ: Даем использовать Retina-разрешение, 
            // но ограничиваем максимум двойкой, чтобы не перегружать GPU
            devicePixelRatio: Math.min(window.devicePixelRatio, 2) 
        };

        fixGeometry();

        createUnityInstance(canvas, config, (progress) => {
            progressBar.style.width = Math.floor(progress * 100) + "%";
            if (progress >= 1.0) {
                var loader = document.querySelector('#loader-wrapper');
                if(loader) loader.style.opacity = '0';
            }
        }).then((unityInstance) => {
            var bg = document.querySelector('.bg-img');
            var loader = document.querySelector('#loader-wrapper');
            
            fixGeometry();
            if(bg) bg.style.opacity = '0';
            
            window.focus();
            canvas.focus();
            
            setTimeout(() => {
                if(bg) bg.remove();
                if(loader) loader.remove();
            }, 500);
        }).catch((message) => { 
            alert("Ошибка загрузки: " + message); 
        });

        fixGeometry();
        document.addEventListener("DOMContentLoaded", fixGeometry);
    </script>
</body>
</html>
