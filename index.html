<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no,
          viewport-fit=cover">

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: -webkit-fill-available;
            overflow: hidden;
            background: #000;
            overscroll-behavior: none;
            touch-action: none;
        }

        body {
            position: relative;
        }

        .game-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        #unity-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: block;
        }

        #loader-wrapper {
            position: absolute;
            top: 50%;
            left: 25%;
            width: 50%;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            z-index: 3;
            transform: translateY(-50%);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #8a00ff;
            transition: width 0.3s ease;
        }
    </style>
</head>

<body>
<div class="game-container">

    <img src="Preview.png" class="bg-img">

    <div id="loader-wrapper">
        <div id="progress-bar"></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

</div>

<script src="Build/Peasd Ariky.loader.js"></script>

<script>
const canvas = document.querySelector("#unity-canvas");
const progressBar = document.querySelector("#progress-bar");

/* ---------------- viewport ---------------- */

function getH() {
    return window.visualViewport?.height || window.innerHeight;
}

function getW() {
    return window.visualViewport?.width || window.innerWidth;
}

function resizeCanvas() {
    const w = getW();
    const h = getH();
    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
}

/* ---------------- iOS stabilization ---------------- */

function waitIOSReady(cb) {
    let last = getH();
    let stable = 0;

    function tick() {
        const h = getH();

        if (Math.abs(h - last) < 2) stable++;
        else stable = 0;

        last = h;

        if (stable >= 8) {
            setTimeout(cb, 200); // iOS buffer
        } else {
            requestAnimationFrame(tick);
        }
    }

    tick();
}

/* ---------------- prewarm resize ---------------- */

function hardResizeLoop(times) {
    let i = 0;

    function step() {
        resizeCanvas();
        i++;
        if (i < times) requestAnimationFrame(step);
    }

    step();
}

/* ---------------- listeners ---------------- */

if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resizeCanvas);
    window.visualViewport.addEventListener("scroll", resizeCanvas);
} else {
    window.addEventListener("resize", resizeCanvas);
}

window.addEventListener("orientationchange", () => {
    setTimeout(resizeCanvas, 100);
    setTimeout(resizeCanvas, 300);
});

/* ---------------- Unity config ---------------- */

const config = {
    dataUrl: "Build/Peasd Ariky.data",
    frameworkUrl: "Build/Peasd Ariky.framework.js",
    codeUrl: "Build/Peasd Ariky.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DeshaCompany",
    productName: "Peasd Ariky",
    productVersion: "0.3",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: window.devicePixelRatio || 1
};

/* ---------------- boot ---------------- */

resizeCanvas();

/* главный фикс: НЕ стартуем Unity пока iOS viewport не стабилен */
waitIOSReady(() => {

    hardResizeLoop(12);

    setTimeout(() => {

        createUnityInstance(canvas, config, (progress) => {

            progressBar.style.width = Math.floor(progress * 100) + "%";

            if (progress >= 1.0) {
                const loader = document.querySelector("#loader-wrapper");
                if (loader) loader.style.opacity = "0";
            }

        }).then((unityInstance) => {

            const bg = document.querySelector(".bg-img");
            const loader = document.querySelector("#loader-wrapper");

            if (bg) bg.style.opacity = "0";

            window.focus();
            canvas.focus();

            hardResizeLoop(5);

            setTimeout(() => {
                if (bg) bg.remove();
                if (loader) loader.remove();
            }, 500);

        }).catch((message) => {
            alert("Ошибка загрузки: " + message);
        });

    }, 300);

});

/* старт */
document.addEventListener("DOMContentLoaded", resizeCanvas);
</script>

</body>
</html>
