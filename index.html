<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            background-color: #000;
            /* Фиксируем body, чтобы избежать случайного смещения страницы */
            position: fixed;
        }

        .game-container {
            position: absolute; 
            top: 0; 
            left: 0;
            width: 100%; 
            /* 100dvh — динамическая высота, которая адаптируется под появление/скрытие панелей Safari */
            height: 100dvh; 
            overflow: hidden;
        }

        .bg-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            transform-origin: left center; 
            transition: opacity 0.5s ease;
            animation: zoomEffect 30s linear forwards;
            will-change: transform;
            backface-visibility: hidden;
        }

        @keyframes zoomEffect {
            from { transform: scale(1); }
            to { transform: scale(1.7); }
        }

        #loader-wrapper {
            position: absolute; top: 50%; left: 25%; width: 50%;
            height: 60px; background: rgba(0, 0, 0, 0.3);
            border-radius: 15px; overflow: hidden; z-index: 3;
            transition: opacity 0.5s ease;
        }

        #progress-bar {
            width: 0%; height: 100%; background: #8a00ff; transition: width 0.3s ease;
        }

        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
            /* object-fit: fill гарантирует отсутствие рамок, растягивая канвас на всю область контейнера */
            object-fit: fill;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <img src="Preview.png" class="bg-img">
        <div id="loader-wrapper">
            <div id="progress-bar"></div>
        </div>
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var progressBar = document.querySelector("#progress-bar");
        var container = document.querySelector(".game-container");

        // Умная коррекция геометрии
        function fixGeometry() {
            // Принудительно сбрасываем скролл, чтобы Safari скрыл адресную строку
            window.scrollTo(0, 0);
            
            // Если мы в вертикальном режиме, проверяем, нет ли фантомных отступов
            if (window.innerHeight > window.innerWidth) {
                container.style.height = "100dvh";
            } else {
                container.style.height = "100%";
            }
        }

        window.addEventListener('resize', fixGeometry);
        window.addEventListener('orientationchange', () => {
            setTimeout(fixGeometry, 200);
        });

        var config = {
            dataUrl: "Build/Peasd Ariky.data",
            frameworkUrl: "Build/Peasd Ariky.framework.js",
            codeUrl: "Build/Peasd Ariky.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DeshaCompany",
            productName: "Peasd Ariky",
            productVersion: "0.3",
        };

        createUnityInstance(canvas, config, (progress) => {
            progressBar.style.width = Math.floor(progress * 100) + "%";
            if (progress >= 1.0) {
                progressBar.style.opacity = '0';
            }
        }).then((unityInstance) => {
            var bg = document.querySelector('.bg-img');
            var loader = document.querySelector('#loader-wrapper');
            
            fixGeometry();
            
            bg.style.opacity = '0';
            loader.style.opacity = '0';
            
            window.focus();
            canvas.focus();
            
            setTimeout(() => {
                if(bg) bg.remove();
                if(loader) loader.remove();
            }, 500);
        }).catch((message) => { 
            alert("Ошибка загрузки: " + message); 
        });

        // Начальный вызов
        fixGeometry();
    </script>
</body>
</html>
