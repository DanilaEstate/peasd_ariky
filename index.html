<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>Peasd Ariky</title>

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

/* ---------------- BASE ---------------- */

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* SAFE AREA (челка) */
body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

/* ---------------- APP ROOT ---------------- */

.game-container {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    height: calc(var(--vh, 1vh) * 100);

    overflow: hidden;
    background: #000;
}

/* ---------------- PREVIEW FIX ---------------- */
/* делаем НЕ img, а background — чтобы iOS не ломал первый frame */

.game-container {
    background: url("Preview.png") center center / cover no-repeat;
}

/* ---------------- UNITY ---------------- */

#unity-canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
    background: #000;
    z-index: 2;
}

/* ---------------- LOADER ---------------- */

#loader-wrapper {
    position: absolute;
    top: 50%;
    left: 25%;
    width: 50%;
    height: 60px;

    transform: translateY(-50%);
    background: rgba(0,0,0,0.3);
    border-radius: 15px;

    overflow: hidden;
    z-index: 3;
}

#progress-bar {
    width: 0%;
    height: 100%;
    background: #8a00ff;
    transition: width 0.3s ease;
}

/* ---------------- FIRST FRAME CONTROL ---------------- */

#unity-canvas {
    visibility: hidden;
}

body.ready #unity-canvas {
    visibility: visible;
}

</style>
</head>

<body>

<div class="game-container">

    <div id="loader-wrapper">
        <div id="progress-bar"></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

</div>

<script src="Build/Peasd Ariky.loader.js"></script>

<script>

const canvas = document.querySelector("#unity-canvas");
const progressBar = document.querySelector("#progress-bar");

/* ---------------- REAL iOS HEIGHT ---------------- */

function setVH() {
    const vh = (window.visualViewport?.height || window.innerHeight) * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
}

/* ---------------- RESIZE ---------------- */

function resizeCanvas() {

    const w = window.visualViewport?.width || window.innerWidth;
    const h = window.visualViewport?.height || window.innerHeight;

    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
}

/* ---------------- BOOT FIX ---------------- */

function showApp() {
    document.body.classList.add("ready");
}

/* ---------------- LISTENERS ---------------- */

function bind() {

    setVH();
    resizeCanvas();

    window.addEventListener("resize", () => {
        setVH();
        resizeCanvas();
    });

    if (window.visualViewport) {

        window.visualViewport.addEventListener("resize", () => {
            setVH();
            resizeCanvas();
        });

        window.visualViewport.addEventListener("scroll", resizeCanvas);
    }

    window.addEventListener("orientationchange", () => {
        setTimeout(() => {
            setVH();
            resizeCanvas();
        }, 100);
    });
}

/* ---------------- UNITY CONFIG ---------------- */

const config = {

    dataUrl: "Build/Peasd Ariky.data",
    frameworkUrl: "Build/Peasd Ariky.framework.js",

    codeUrl: "Build/Peasd Ariky.wasm",

    streamingAssetsUrl: "StreamingAssets",

    companyName: "DeshaCompany",
    productName: "Peasd Ariky",
    productVersion: "0.3",

    matchWebGLToCanvasSize: true,
    devicePixelRatio: window.devicePixelRatio || 1
};

/* ---------------- BOOT ---------------- */

setVH();
resizeCanvas();

/* даём iOS отрисовать preview ПЕРВЫМ */
requestAnimationFrame(() => {
    requestAnimationFrame(() => {

        showApp();
        bind();

        createUnityInstance(canvas, config, (progress) => {
            progressBar.style.width = Math.floor(progress * 100) + "%";
        }).then(() => {

            const loader = document.querySelector("#loader-wrapper");

            setTimeout(() => {
                if (loader) loader.remove();
            }, 400);

        });

    });
});

</script>

</body>
</html>
