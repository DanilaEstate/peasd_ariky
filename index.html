<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-style" content="black-translucent">

    <style>
      html, body {
        width: 100%;
        height: calc(var(--vh, 1vh) * 100);
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #000;
        box-sizing: border-box;
      }

      body {
        padding-top: env(safe-area-inset-top);
      }

      .game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: calc(var(--vh, 1vh) * 100);
        overflow: hidden;
      }

      .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: left center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.7); }
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.3s ease;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        object-fit: fill;
      }
    </style>

    <script>
      function setAppHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }

      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', setAppHeight);
      setAppHeight();
    </script>
  </head>

  <body>
    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var config = {
        dataUrl: "Build/Peasd Ariky.data",
        frameworkUrl: "Build/Peasd Ariky.framework.js",
        codeUrl: "Build/Peasd Ariky.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.3",
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {
        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
