<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Peasd Ariky</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
html, body {
    width: 100%;
    height: 100%; /* Уходим от vh здесь */
    padding: 0;
    margin: 0;
    overflow: hidden;
    background-color: #000;
    position: fixed; /* Держит экран на месте */
}

.game-container {
    position: absolute; /* absolute внутри fixed body лучше дружит с координатами */
    top: 0;
    left: 0;
    width: 100%;
    height: 100dvh; /* Вот здесь оставляем dvh */
    overflow: hidden;
}


/* Фон с увеличением (от левого края) */
.bg-img {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 1;
        
        /* Добавь эту строку: */
        transform-origin: left center; 
        
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

@keyframes zoomEffect {
from { transform: scale(1); }
to { transform: scale(1.7); }
}

#loader-wrapper {
position: absolute; top: 50%; left: 25%; width: 50%;
height: 60px; background: rgba(0, 0, 0, 0.3);
border-radius: 15px; overflow: hidden; z-index: 3;
}

#progress-bar {
width: 0%; height: 100%; background: #8a00ff; transition: width 0.3s ease;
}

#unity-canvas {
width: 100% !important;
height: 100% !important;
display: block;
position: absolute;
top: 0;
left: 0;
z-index: 2;
/* Object-fit fill заполнит всё пространство канваса */
object-fit: fill;
}
</style>
</head>
<body>
<div class="game-container">
<img src="Preview.png" class="bg-img">
<div id="loader-wrapper"><div id="progress-bar"></div></div>
<canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<script src="Build/Peasd Ariky.loader.js"></script>
<script>
var canvas = document.querySelector("#unity-canvas");
var progressBar = document.querySelector("#progress-bar");

var config = {
dataUrl: "Build/Peasd Ariky.data",
frameworkUrl: "Build/Peasd Ariky.framework.js",
codeUrl: "Build/Peasd Ariky.wasm",
streamingAssetsUrl: "StreamingAssets",
companyName: "DeshaCompany",
productName: "Peasd Ariky",
productVersion: "0.3",
};

function fixScroll() {
    // Не переписываем высоту через JS, пусть CSS (100dvh) делает свою работу
    window.scrollTo(0, 1);
    setTimeout(() => {
        window.scrollTo(0, 0);
        // Принудительно обновляем размер канваса под вьюпорт браузера
        if (canvas) {
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }
    }, 50);
}

// Вызываем это не только при ресайзе, но и каждые 250мс первые пару секунд
window.addEventListener('resize', fixScroll);
window.addEventListener('orientationchange', fixScroll);

createUnityInstance(canvas, config, (progress) => {
progressBar.style.width = Math.floor(progress * 100) + "%";
if (progress >= 1.0) progressBar.style.opacity = '0';
}).then((unityInstance) => {
fixScroll();
document.querySelector('.bg-img').style.opacity = '0';
document.querySelector('#loader-wrapper').style.opacity = '0';
window.focus();
canvas.focus();
setTimeout(() => {
document.querySelector('.bg-img').remove();
document.querySelector('#loader-wrapper').remove();
}, 500);
}).catch((message) => { alert(message); });
</script>
</body>
</html>
