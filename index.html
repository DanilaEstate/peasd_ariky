<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- ИЗМЕНЕНО (v10): вернулся height=device-height.
         Диагностика v8 показала рассогласование: экран 812, а страница 762.
         height=device-height прямо приказывает layout viewport быть равным
         высоте устройства, а не "экран минус статус-бар". -->
    <meta id="viewport-meta" name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <title>Peasd Ariky</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- ИЗМЕНЕНО (v10): снова black-translucent — только он убирает плашку
         сверху и пускает игру под статус-бар. Дыру снизу, которую он раньше
         оставлял, закрывают два приёма ниже:
         1) height=device-height в viewport;
         2) вёрстка БЕЗ position: fixed на html/body — контейнер игры
            абсолютный и заданного в пикселях размера, поэтому он имеет право
            выйти за нижнюю границу layout viewport и быть там отрисованным.
            Раньше всё было fixed, а fixed-элементы жёстко обрезаются по
            viewport — отсюда и бралась полоса цвета фона. -->
    <meta id="status-bar-meta" name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#151a33">

    <style>
      :root {
        --app-width: 100%;
        --app-height: 100%;
      }

      /* Никакого position: fixed. Фон — тёмно-синий под игру, а не чёрный:
         если что-то системное всё же проглянет, оно сольётся с игрой. */
      html, body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        background-color: #151a33;
        box-sizing: border-box;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      .game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--app-width);
        height: var(--app-height);
        overflow: hidden;
        z-index: 1;
      }

      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      #debug-panel {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 101;
        display: none;
        margin: 0;
        padding: 6px 8px;
        max-width: 100%;
        font: 12px/1.4 monospace;
        color: #0f0;
        background: rgba(0, 0, 0, 0.82);
        white-space: pre;
        pointer-events: none;
      }

      body.debug-on #debug-panel {
        display: block;
      }

      .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.5); }
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.25s ease;
      }

      #unity-canvas {
        width: var(--app-width) !important;
        height: var(--app-height) !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        object-fit: fill;
      }
    </style>

    <script>
      var APP_VERSION = 'v12';

      window.__unityInstance = null;

      // Состояние Unity-скриптов приезжает сюда обычными логами: WebSafeArea
      // раз в полсекунды пишет Debug.Log('SA|...'), а мы вылавливаем такие
      // строки и печатаем в этой же панели. Никаких плагинов не нужно.
      var __unityText = '';

      function captureUnityLine(s) {
        if (typeof s !== 'string') return;

        var at = s.indexOf('SA|');
        if (at < 0) return;

        var line = s.substring(at + 3);
        var nl = line.indexOf('\n');
        if (nl >= 0) line = line.substring(0, nl);

        __unityText = line.split(' ; ').join('\n');

        updateDebugPanel();
      }

      var __lastW = 0;
      var __lastH = 0;
      var __src = '-';

      function isStandaloneApp() {
        if (window.navigator.standalone === true) return true;
        if (!window.matchMedia) return false;

        return window.matchMedia('(display-mode: standalone)').matches ||
               window.matchMedia('(display-mode: fullscreen)').matches ||
               window.matchMedia('(display-mode: minimal-ui)').matches;
      }

      function readSafeAreaInsets() {
        var probe = document.getElementById('safe-probe');
        if (!probe || !window.getComputedStyle) return null;

        var cs = window.getComputedStyle(probe);

        return {
          top: parseFloat(cs.paddingTop) || 0,
          bottom: parseFloat(cs.paddingBottom) || 0,
          left: parseFloat(cs.paddingLeft) || 0,
          right: parseFloat(cs.paddingRight) || 0
        };
      }

      function isCoverActive() {
        var i = readSafeAreaInsets();
        if (!i) return false;

        return (i.top > 0 || i.bottom > 0 || i.left > 0 || i.right > 0);
      }

      // ДОБАВЛЕНО (v11): различаем два состояния iOS, раньше их путали.
      // safe-area-inset-top > 0  -> статус-бар НАКРЫВАЕТ страницу, окно равно
      //                             всему экрану, высоту можно дотягивать.
      // safe-area-inset-top = 0  -> iOS зарезервировал статус-бар себе (стиль
      //                             black, в том числе закешированный при
      //                             установке иконки). Окно уже меньше экрана,
      //                             дотягивать НЕЛЬЗЯ — низ игры уедет за край.
      function statusBarOverlapsPage() {
        var i = readSafeAreaInsets();
        return !!(i && i.top > 0);
      }

      function notchOverlapsPage() {
        var i = readSafeAreaInsets();
        return !!(i && (i.left > 0 || i.right > 0));
      }

      // screen.width/height на iOS не всегда меняются местами при повороте,
      // поэтому ориентацию определяем сами и подставляем нужную сторону.
      function screenCssSize() {
        if (!window.screen || !screen.width || !screen.height) return null;

        var longSide = Math.max(screen.width, screen.height);
        var shortSide = Math.min(screen.width, screen.height);
        var portrait = window.innerHeight >= window.innerWidth;

        return portrait ? { w: shortSide, h: longSide } : { w: longSide, h: shortSide };
      }

      // База — то, что выдал браузер. И только в установленном приложении с
      // активным cover разрешаем дотянуть размер до полного экрана: ровно на
      // ту недостачу, которую даёт статус-бар (жёсткий предел 120px, чтобы
      // кривые значения screen.* никогда не растянули игру абы куда).
      function computeSize() {
        var w = window.innerWidth || document.documentElement.clientWidth;
        var h = window.innerHeight || document.documentElement.clientHeight;

        __src = 'inner';

        var vv = window.visualViewport;

        if (vv && !isStandaloneApp()) {
          w = Math.round(vv.width);
          h = Math.round(vv.height);
          __src = 'visual';
        }

        if (isStandaloneApp()) {
          var s = screenCssSize();

          if (s) {
            if (statusBarOverlapsPage() && s.h > h && s.h - h <= 120) {
              h = s.h;
              __src = 'screen';
            }

            if (notchOverlapsPage() && s.w > w && s.w - w <= 120) {
              w = s.w;
              __src = 'screen';
            }
          }
        }

        return { w: w, h: h };
      }

      function applySize() {
        var s = computeSize();

        document.documentElement.style.setProperty('--app-width', s.w + 'px');
        document.documentElement.style.setProperty('--app-height', s.h + 'px');

        var changed = (s.w !== __lastW || s.h !== __lastH);

        __lastW = s.w;
        __lastH = s.h;

        return changed;
      }

      var VIEWPORT_BASE = 'width=device-width, height=device-height, user-scalable=no, viewport-fit=cover';

      function setViewport(scale) {
        var meta = document.getElementById('viewport-meta');
        if (!meta) return;

        meta.setAttribute(
          'content',
          VIEWPORT_BASE +
            ', initial-scale=' + scale +
            ', minimum-scale=' + scale +
            ', maximum-scale=' + scale);
      }

      function nudgeViewport() {
        if (isCoverActive()) return;

        setViewport('1.0001');

        setTimeout(function () {
          setViewport('1');
          window.scrollTo(0, 0);
        }, 40);
      }

      function notifyUnitySafeArea() {
        if (!window.__unityInstance) return;

        var i = readSafeAreaInsets();
        if (!i) return;

        try {
          window.__unityInstance.SendMessage(
            'WebSafeArea',
            'SetSafeAreaFromWeb',
            i.top + ',' + i.bottom + ',' + i.left + ',' + i.right +
              ',' + __lastW + ',' + __lastH);
        } catch (e) {
          // Объекта на сцене пока нет — это не ошибка.
        }
      }

      function updateDebugPanel() {
        var panel = document.getElementById('debug-panel');
        if (!panel || !document.body) return;
        if (!document.body.classList.contains('debug-on')) return;

        var i = readSafeAreaInsets() || { top: 0, bottom: 0, left: 0, right: 0 };
        var cvs = document.getElementById('unity-canvas');
        var rect = cvs ? cvs.getBoundingClientRect() : null;
        var sw = (window.screen && screen.width) ? screen.width : 0;
        var sh = (window.screen && screen.height) ? screen.height : 0;

        panel.textContent =
          APP_VERSION + '   cover: ' + (isCoverActive() ? 'ON' : 'OFF') + '\n' +
          'mode: ' + (statusBarOverlapsPage() ? 'TRANSLUCENT ok' : 'RESERVED (old meta)') + '\n' +
          'standalone: ' + isStandaloneApp() + '\n' +
          'inner:  ' + window.innerWidth + ' x ' + window.innerHeight + '\n' +
          'screen: ' + sw + ' x ' + sh + '\n' +
          'applied: ' + __lastW + ' x ' + __lastH + '  (' + __src + ')\n' +
          'doc h:  ' + document.documentElement.scrollHeight + '\n' +
          'cvs css: ' + (cvs ? cvs.clientWidth + ' x ' + cvs.clientHeight : 'n/a') + '\n' +
          'cvs bot: ' + (rect ? Math.round(rect.bottom) : 'n/a') + '\n' +
          'safe t/b/l/r: ' + i.top + ' / ' + i.bottom + ' / ' + i.left + ' / ' + i.right + '\n' +
          'dpr: ' + window.devicePixelRatio + '\n' +
          '--- unity ---\n' +
          (__unityText || 'нет данных: старые скрипты или игра не загрузилась');
      }

      function syncNow(nudge) {
        if (nudge) nudgeViewport();

        var changed = applySize();
        if (changed) window.dispatchEvent(new Event('resize'));

        notifyUnitySafeArea();
        updateDebugPanel();
      }

      function refreshViewport() {
        var nudgeAt = [0, 250, 700, 1500, 3000];

        for (var i = 0; i < nudgeAt.length; i++) {
          (function (d) {
            setTimeout(function () { syncNow(true); }, d);
          })(nudgeAt[i]);
        }

        var plainAt = [60, 150, 400, 1000, 2000, 4000];

        for (var j = 0; j < plainAt.length; j++) {
          (function (d) {
            setTimeout(function () { syncNow(false); }, d);
          })(plainAt[j]);
        }
      }

      // Документ теперь может быть чуть выше viewport — страницу нельзя
      // давать прокручивать, иначе сверху вылезет полоса фона.
      window.addEventListener('scroll', function () {
        if (window.pageYOffset !== 0 || window.pageXOffset !== 0) window.scrollTo(0, 0);
      }, { passive: true });

      window.addEventListener('resize', function () { syncNow(false); });
      window.addEventListener('orientationchange', refreshViewport);
      window.addEventListener('pageshow', refreshViewport);
      window.addEventListener('focus', refreshViewport);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refreshViewport();
      });

      document.addEventListener('DOMContentLoaded', function () {
        if (location.search.indexOf('debug=1') >= 0) {
          document.body.classList.add('debug-on');
        }

        refreshViewport();
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { syncNow(false); });
        window.visualViewport.addEventListener('scroll', function () { window.scrollTo(0, 0); });
      }

      if (window.screen && screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener('change', refreshViewport);
      }

      setInterval(function () { syncNow(false); }, 500);

      // ИЗМЕНЕНО: пять тапов в левом верхнем углу — показать/скрыть цифры.
      // Случайно такую серию уже не набрать.
      (function () {
        var taps = 0;
        var timer = null;

        window.addEventListener('touchend', function (e) {
          var t = e.changedTouches && e.changedTouches[0];
          if (!t) return;
          if (t.clientX > 90 || t.clientY > 90) return;

          taps++;

          if (timer) clearTimeout(timer);
          timer = setTimeout(function () { taps = 0; }, 900);

          if (taps >= 5) {
            taps = 0;
            document.body.classList.toggle('debug-on');
            updateDebugPanel();
          }
        }, { passive: true });
      })();
    </script>
  </head>

  <body>
    <div id="safe-probe"></div>
    <pre id="debug-panel"></pre>

    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/6c5ac0e950646a31a3e5f6519d5767b7.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var config = {
        dataUrl: "Build/3d7bf5c5eb162be4750846db517020a4.data.unityweb",
        frameworkUrl: "Build/7e6ba39debfd53668df40ec4f2ceab64.framework.js.unityweb",
        codeUrl: "Build/fd42690eb3baaf72878d8ffaa4366e0c.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.4",
        matchWebGLToCanvasSize: true,

        // Логи Unity ловим здесь: из них берём состояние WebSafeArea.
        print: function (s) { captureUnityLine(s); },
        printErr: function (s) { captureUnityLine(s); },
      };

      // Подстраховка: в некоторых версиях Unity пишет прямо в console.log.
      (function () {
        var original = console.log;

        console.log = function () {
          try {
            if (arguments.length > 0) captureUnityLine(arguments[0]);
          } catch (e) {}

          original.apply(console, arguments);
        };
      })();

      refreshViewport();

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {
        window.__unityInstance = unityInstance;

        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        refreshViewport();

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
