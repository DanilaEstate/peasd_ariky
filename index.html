<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
      html, body {
        width: 100%;
        height: 100%; /* Убрали -webkit-fill-available, чтобы не было отступа снизу */
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #000;
        /* Блокируем случайные свайпы, из-за которых Safari показывает свои панели */
        touch-action: none; 
    }

    .game-container {
        position: absolute;
        /* Привязываем ко всем 4 краям физического экрана */
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
    }

      /* Фон с увеличением (от левого края) */
      .bg-img {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: left center; 
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.7); }
      }

      #loader-wrapper {
        position: absolute; top: 50%; left: 25%; width: 50%;
        height: 60px; background: rgba(0, 0, 0, 0.3);
        border-radius: 15px; overflow: hidden; z-index: 3;
      }

      #progress-bar {
        width: 0%; height: 100%; background: #8a00ff; transition: width 0.3s ease;
      }

      #unity-canvas {
        /* 100% заставят его занять весь game-container, который растянут на весь экран */
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        object-fit: cover; 
    }
    </style>
  </head>
  <body>
    <div class="game-container">
      <img src="Preview.png" class="bg-img">
      <div id="loader-wrapper"><div id="progress-bar"></div></div>
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var config = {
        dataUrl: "Build/Peasd Ariky.data",
        frameworkUrl: "Build/Peasd Ariky.framework.js",
        codeUrl: "Build/Peasd Ariky.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.3",
      };

      // Мы убрали скрипт, который высчитывал пиксели через innerHeight!
      // Теперь мы просто сбрасываем скролл, чтобы браузер не уезжал вниз.
      function fixScroll() {
          window.scrollTo(0, 0);
      }

      window.addEventListener('resize', fixScroll);
      window.addEventListener('orientationchange', fixScroll);

      createUnityInstance(canvas, config, (progress) => {
          progressBar.style.width = Math.floor(progress * 100) + "%";
          if (progress >= 1.0) progressBar.style.opacity = '0';
      }).then((unityInstance) => {
          fixScroll();
          document.querySelector('.bg-img').style.opacity = '0';
          document.querySelector('#loader-wrapper').style.opacity = '0';
          window.focus();
          canvas.focus();
          
          setTimeout(() => {
              document.querySelector('.bg-img').remove();
              document.querySelector('#loader-wrapper').remove();
          }, 500);
      }).catch((message) => { alert(message); });
    </script>
  </body>
</html>
