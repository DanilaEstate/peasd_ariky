<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peast Ariky</title>
    <!-- 1. Подключаем внешний скрипт Яндекса -->
    <!--<script src="https://yandex.ru/games/sdk/v2"></script>-->
    <style>
      html, body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        /* Меняем на цвет фона твоей игры, чтобы полоски не были белыми */
        background-color: #1a2b3c !important; /* Твой синий цвет из игры */
        position: fixed; /* Предотвращает "прыжки" экрана при свайпах */
      }
      #unity-canvas {
        /* Используем vw и vh вместо процентов для гарантии */
        width: 100vw !important;
        height: 100vh !important;
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        /* Это заставит картинку растянуться на весь экран, игнорируя пропорции */
        object-fit: fill;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1" style="background-color: #1a2b3c;"></canvas>

    <script src="Build/Peast Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      var config = {
        dataUrl: "Build/Peast Ariky.data",
        frameworkUrl: "Build/Peast Ariky.framework.js",
        codeUrl: "Build/Peast Ariky.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peast Ariky",
        productVersion: "0.3",
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          // viewport-fit=cover — это ключ к победе над челкой
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
          document.getElementsByTagName('head')[0].appendChild(meta);

          // Убираем любые системные отступы Safari
          document.documentElement.style.setProperty('--sab', 'env(safe-area-inset-bottom)');
          document.documentElement.style.setProperty('--sat', 'env(safe-area-inset-top)');
          
          // Принудительно сажаем канвас в углы
          canvas.style.position = "fixed";
          canvas.style.top = "0";
          canvas.style.left = "0";
          canvas.style.width = "100%";
          canvas.style.height = "100%";
      }

      // 2. Сначала инициализируем Яндекс, затем создаем инстанс Unity
      //YaGames.init().then(ysdk => {
      //    console.log('Yandex SDK initialized');
      //    window.ysdk = ysdk; // Это критически важно для работы плагина в Unity
//
      //    // 2. Инициализацию Яндекса пропускаем для GitHub, запускаем Unity напрямую
            createUnityInstance(canvas, config, (progress) => {
                // лоадер
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
            }).catch((message) => {
                alert(message);
            });
      //});
    </script>
  </body>
</html>
