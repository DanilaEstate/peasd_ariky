<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no,
          viewport-fit=cover">

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            overscroll-behavior: none;
            touch-action: none;
        }

        body {
            position: relative;
        }

        .game-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        #unity-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 2;
            display: block;
        }

        #loader-wrapper {
            position: absolute;
            top: 50%;
            left: 25%;
            width: 50%;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            z-index: 3;
            transform: translateY(-50%);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #8a00ff;
            transition: width 0.3s ease;
        }
    </style>
</head>

<body>
<div class="game-container">

    <img src="Preview.png" class="bg-img">

    <div id="loader-wrapper">
        <div id="progress-bar"></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

</div>

<script src="Build/Peasd Ariky.loader.js"></script>

<script>
const canvas = document.querySelector("#unity-canvas");
const progressBar = document.querySelector("#progress-bar");

/* ---------------- viewport helpers ---------------- */

function getHeight() {
    return window.visualViewport?.height || window.innerHeight;
}

function getWidth() {
    return window.visualViewport?.width || window.innerWidth;
}

function resizeCanvas() {
    const width = getWidth();
    const height = getHeight();
    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
}

/* ---------------- stabilization gate ---------------- */

function waitStableViewport(callback) {
    let last = getHeight();
    let stable = 0;

    function check() {
        const h = getHeight();

        if (Math.abs(h - last) < 2) {
            stable++;
        } else {
            stable = 0;
        }

        last = h;

        if (stable > 5) {
            callback();
        } else {
            requestAnimationFrame(check);
        }
    }

    check();
}

/* ---------------- listeners ---------------- */

if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resizeCanvas);
    window.visualViewport.addEventListener("scroll", resizeCanvas);
} else {
    window.addEventListener("resize", resizeCanvas);
}

window.addEventListener("orientationchange", () => {
    setTimeout(resizeCanvas, 100);
    setTimeout(resizeCanvas, 300);
});

/* ---------------- Unity config ---------------- */

const config = {
    dataUrl: "Build/Peasd Ariky.data",
    frameworkUrl: "Build/Peasd Ariky.framework.js",
    codeUrl: "Build/Peasd Ariky.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DeshaCompany",
    productName: "Peasd Ariky",
    productVersion: "0.3",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: window.devicePixelRatio || 1
};

/* ---------------- boot ---------------- */

resizeCanvas();

/* важно: ждём стабилизации viewport ДО Unity */
waitStableViewport(() => {

    resizeCanvas();

    createUnityInstance(canvas, config, (progress) => {

        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
            const loader = document.querySelector("#loader-wrapper");
            if (loader) loader.style.opacity = "0";
        }

    }).then((unityInstance) => {

        const bg = document.querySelector(".bg-img");
        const loader = document.querySelector("#loader-wrapper");

        resizeCanvas();

        if (bg) bg.style.opacity = "0";

        window.focus();
        canvas.focus();

        setTimeout(resizeCanvas, 50);
        setTimeout(resizeCanvas, 200);
        setTimeout(resizeCanvas, 500);

        setTimeout(() => {
            if (bg) bg.remove();
            if (loader) loader.remove();
        }, 500);

    }).catch((message) => {
        alert("Ошибка загрузки: " + message);
    });

});

/* старт */
document.addEventListener("DOMContentLoaded", resizeCanvas);
</script>

</body>
</html>
