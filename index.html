<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-style" content="black-translucent">

    <style>
      html, body {
        width: 100%;
        height: var(--app-height);
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #000;
        box-sizing: border-box;
        /* ДОБАВЛЕНО: убирает "резиновый" bounce-скролл и pinch-zoom жесты
           iOS Safari, которые overflow:hidden сам по себе НЕ блокирует —
           это отдельная известная особенность iOS Safari. Без этого палец
           на экране может конфликтовать с системным скроллом/зумом
           страницы, что ощущается как подёргивания во время управления. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* ДОБАВЛЕНО: фиксируем body, чтобы iOS Safari не пытался скроллить
         страницу целиком при жестах внутри канваса. */
      body {
        margin: 0;
        height: var(--app-height);
        overflow: hidden;
        background: black;
        position: fixed;
        inset: 0;
      }

      .game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--app-height);
        overflow: hidden;
        touch-action: none;
      }

      .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.5); }
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.25s ease;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        object-fit: fill;
        /* ДОБАВЛЕНО: сама канвас-область тоже должна игнорировать системные
           жесты, иначе именно на ней iOS чаще всего пытается скроллить/зумить. */
        touch-action: none;
      }
    </style>

    <script>
      // ИЗМЕНЕНО: раньше setAppHeight() пересчитывал --app-height на КАЖДЫЙ
      // resize/visualViewport-ивент без разбора. На iOS Safari адресная
      // строка постоянно скрывается/показывается при скролле и тапах —
      // это стреляет resize очень часто, а каждое такое присвоение
      // --app-height мгновенно меняет CSS-размер канваса, что заставляет
      // WebGL пересоздавать framebuffer буквально на ходу — и даёт
      // микрозависания, даже когда счётчик FPS показывает ровные 60
      // (он считает логические кадры скрипта, а не то, что реально долетело
      // до экрана).
      //
      // Теперь: 1) обновляем высоту только если она реально изменилась
      // больше чем на 1px (защита от дребезга/rounding), 2) делаем это через
      // rAF, чтобы не пересчитывать layout синхронно внутри самого
      // resize-колбэка.
      let lastAppHeight = 0;
      let appHeightRaf = null;

      function setAppHeight() {
        if (appHeightRaf !== null) return;

        appHeightRaf = requestAnimationFrame(() => {
          appHeightRaf = null;
          const vv = window.visualViewport;
          const height = vv ? vv.height : window.innerHeight;

          if (Math.abs(height - lastAppHeight) < 1) return;

          lastAppHeight = height;
          document.documentElement.style.setProperty('--app-height', height + 'px');
        });
      }

      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', setAppHeight);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setAppHeight);
      }

      setAppHeight();
    </script>
  </head>

  <body>
    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      var config = {
        dataUrl: "Build/Peasd Ariky.data",
        frameworkUrl: "Build/Peasd Ariky.framework.js",
        codeUrl: "Build/Peasd Ariky.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.4",
      };

      // ДОБАВЛЕНО: главный фикс для "глючит, хотя 60 fps" на iPhone.
      // На retina-экранах devicePixelRatio = 3 (на iPhone 13 mini — тоже 3),
      // и Unity WebGL по умолчанию рендерит канвас именно в это количество
      // раз больше пикселей, чем реально видно на экране — то есть GPU
      // обсчитывает в 9 РАЗ больше пикселей, чем на обычном 1x экране.
      // JS/скрипты при этом успевают отработать вовремя (отсюда ровные
      // 60 fps на счётчике), а вот GPU не успевает — итоговый кадр
      // до экрана долетает с опозданием/дропается, что и ощущается как
      // подлагивания при формально стабильном FPS.
      //
      // Ограничиваем devicePixelRatio на мобильных до 1 — можно попробовать
      // 1.5 или 2, если на глаз картинка покажется слишком мыльной, но 1 —
      // самый надёжный вариант по производительности, особенно если на
      // уровне много Light2D (у них в URP 2D Renderer каждый источник —
      // дополнительный проход рендера на каждый пиксель).
      if (isMobile) {
        config.devicePixelRatio = 1;
      }

      if (isMobile) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {
        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        window.dispatchEvent(new Event('resize'));

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
