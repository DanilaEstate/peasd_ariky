<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- ИСПРАВЛЕНО: viewport — СТАТИЧЕСКИЙ тег в head.
         Раньше он создавался из JavaScript уже после загрузки страницы,
         и viewport-fit=cover просто не успевал примениться. -->
    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">

    <title>Peasd Ariky</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- ИСПРАВЛЕНО: была опечатка в имени тега
         (-status-style вместо -status-bar-style), поэтому статус-бар
         не становился прозрачным и оставался чёрной полосой. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="theme-color" content="#000000">

    <style>
      :root {
        --app-height: 100vh;
        --app-height: 100dvh;

        /* Значения безопасной зоны — заполняются скриптом ниже. */
        --sa-top: 0px;
        --sa-bottom: 0px;
        --sa-left: 0px;
        --sa-right: 0px;
      }

      html, body {
        width: 100%;
        height: var(--app-height);
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #000;
        box-sizing: border-box;
      }

      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* ДОБАВЛЕНО: невидимый зонд безопасной зоны.
         Прочитать env(safe-area-inset-*) из JavaScript напрямую нельзя —
         это только CSS-функция. Поэтому кладём её в padding пустого
         элемента и читаем уже вычисленные пиксели через
         getComputedStyle. */
      #safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }

      .game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--app-height);
        overflow: hidden;
      }

      .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.5); }
      }

      /* Полоса загрузки тоже уважает безопасную зону, иначе на боку
         в горизонтали она уезжала под вырез. */
      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.25s ease;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        object-fit: fill;
        touch-action: none;
      }
    </style>

    <script>
      // ИЗМЕНЕНО: измерение высоты полностью переписано.
      //
      // Было: высота бралась из visualViewport.height и применялась один раз.
      //   1) visualViewport.height — высота ВИДИМОЙ области, она меньше,
      //      когда видна панель адреса — по краям оставались чёрные поля.
      //   2) iOS при повороте сообщает СТАРЫЕ размеры окна прямо в момент
      //      события — отсюда баги при переворотах туда-обратно.
      (function () {
        var lastW = 0;
        var lastH = 0;

        // ДОБАВЛЕНО: последние отступы безопасной зоны и ссылка на Unity —
        // нужны, чтобы отправлять значения в игру повторно, когда она
        // уже загрузилась и GameObject-приёмник точно существует.
        var lastSafe = null;

        function measure() {
          var vv = window.visualViewport;

          var h = Math.max(
            window.innerHeight || 0,
            document.documentElement ? document.documentElement.clientHeight : 0,
            vv ? vv.height : 0
          );

          var w = Math.max(
            window.innerWidth || 0,
            document.documentElement ? document.documentElement.clientWidth : 0,
            vv ? vv.width : 0
          );

          return { w: w, h: h };
        }

        // ДОБАВЛЕНО: чтение безопасной зоны через зонд.
        function readSafeArea(size) {
          var probe = document.getElementById('safe-area-probe');

          var t = 0, b = 0, l = 0, r = 0;

          if (probe) {
            var cs = window.getComputedStyle(probe);
            t = parseFloat(cs.paddingTop) || 0;
            b = parseFloat(cs.paddingBottom) || 0;
            l = parseFloat(cs.paddingLeft) || 0;
            r = parseFloat(cs.paddingRight) || 0;
          }

          // Страховка для старых iPhone без выреза (SE и похожие): там
          // env(safe-area-inset-top) равен нулю, но статус-бар всё равно
          // перекрывает верх экрана — поэтому в режиме иконки с рабочего
          // стола гарантируем минимальный отступ.
          var standalone =
            (window.navigator && window.navigator.standalone === true) ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);

          var portrait = size.h >= size.w;

          if (standalone && portrait && t < 20) t = 20;

          return { t: t, b: b, l: l, r: r };
        }

        // ДОБАВЛЕНО: передача безопасной зоны в Unity.
        // Формат строки: "top,bottom,left,right,width,height" в CSS-пикселях.
        // Сама игра переводит их в доли экрана (см. WebSafeArea.cs).
        function pushSafeAreaToUnity(safe, size) {
          var payload = safe.t + ',' + safe.b + ',' + safe.l + ',' + safe.r +
                        ',' + size.w + ',' + size.h;

          window.__lastSafeAreaPayload = payload;

          var inst = window.__unityInstance;
          if (!inst || typeof inst.SendMessage !== 'function') return;

          // GameObject может ещё не существовать (другая сцена, первые
          // кадры загрузки) — Unity в этом случае пишет ошибку в консоль,
          // поэтому глушим исключение и просто повторим позже.
          try {
            inst.SendMessage('WebSafeArea', 'SetSafeAreaFromWeb', payload);
          } catch (e) {}
        }

        function apply(force) {
          var size = measure();
          if (!size.h) return;

          var safe = readSafeArea(size);

          var safeKey = safe.t + '|' + safe.b + '|' + safe.l + '|' + safe.r;
          var sizeChanged = force || size.w !== lastW || size.h !== lastH;
          var safeChanged = safeKey !== lastSafe;

          if (!sizeChanged && !safeChanged) return;

          lastW = size.w;
          lastH = size.h;
          lastSafe = safeKey;

          document.documentElement.style.setProperty('--app-height', size.h + 'px');
          document.documentElement.style.setProperty('--sa-top', safe.t + 'px');
          document.documentElement.style.setProperty('--sa-bottom', safe.b + 'px');
          document.documentElement.style.setProperty('--sa-left', safe.l + 'px');
          document.documentElement.style.setProperty('--sa-right', safe.r + 'px');

          pushSafeAreaToUnity(safe, size);

          if (sizeChanged) {
            // Unity слушает 'resize', чтобы пересчитать буфер рендера.
            window.dispatchEvent(new Event('resize'));
          }
        }

        // Серия повторных замеров: один замер после поворота на iOS почти
        // всегда попадает в момент, когда размеры ещё не обновились.
        function applySettled() {
          apply(false);

          requestAnimationFrame(function () {
            apply(false);
            requestAnimationFrame(function () { apply(false); });
          });

          var delays = [50, 120, 250, 400, 700, 1000];
          for (var i = 0; i < delays.length; i++) {
            setTimeout(function () { apply(false); }, delays[i]);
          }
        }

        window.addEventListener('resize', applySettled);
        window.addEventListener('orientationchange', applySettled);
        window.addEventListener('pageshow', applySettled);
        window.addEventListener('focus', applySettled);

        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) applySettled();
        });

        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', applySettled);
          window.visualViewport.addEventListener('scroll', applySettled);
        }

        if (window.screen && window.screen.orientation &&
            typeof window.screen.orientation.addEventListener === 'function') {
          window.screen.orientation.addEventListener('change', applySettled);
        }

        // "Резиновая" прокрутка после поворота оставляет страницу сдвинутой.
        window.addEventListener('scroll', function () {
          if (window.scrollY !== 0 || window.scrollX !== 0) window.scrollTo(0, 0);
        }, { passive: true });

        var lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) e.preventDefault();
          lastTouchEnd = now;
        }, { passive: false });

        document.addEventListener('gesturestart', function (e) {
          e.preventDefault();
        }, { passive: false });

        window.__applyAppHeight = applySettled;

        // ДОБАВЛЕНО: повторная отправка безопасной зоны по требованию —
        // вызывается из самой игры (WebSafeArea.Start), чтобы получить
        // значения сразу при загрузке любой новой сцены.
        window.__requestSafeArea = function () {
          var size = measure();
          if (!size.h) return;
          pushSafeAreaToUnity(readSafeArea(size), size);
        };

        apply(true);
        applySettled();
      })();
    </script>
  </head>

  <body>
    <div id="safe-area-probe"></div>

    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var config = {
        dataUrl: "Build/Peasd Ariky.data.unityweb",
        frameworkUrl: "Build/Peasd Ariky.framework.js.unityweb",
        codeUrl: "Build/Peasd Ariky.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.4",
        matchWebGLToCanvasSize: true,
      };

      // УДАЛЕНО: создание meta viewport из JavaScript — теперь он статически
      // прописан в head, иначе viewport-fit=cover не срабатывает.

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {
        // ДОБАВЛЕНО: ссылка на экземпляр нужна для SendMessage из
        // измерителя безопасной зоны.
        window.__unityInstance = unityInstance;

        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        if (window.__applyAppHeight) window.__applyAppHeight();
        if (window.__requestSafeArea) window.__requestSafeArea();

        // На первых кадрах сцена ещё может не содержать приёмник —
        // повторяем отправку несколько раз.
        var retries = [100, 300, 700, 1500, 3000];
        for (var i = 0; i < retries.length; i++) {
          setTimeout(function () {
            if (window.__applyAppHeight) window.__applyAppHeight();
            if (window.__requestSafeArea) window.__requestSafeArea();
          }, retries[i]);
        }

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
