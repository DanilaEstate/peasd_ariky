<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- Статичный viewport с viewport-fit=cover — обязательно до любого CSS/JS. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Peasd Ariky</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
      :root {
        --app-width: 100%;
        --app-height: 100%;
      }

      /* Размер всегда берётся из переменных, которые считает скрипт.
         В PWA это физический размер экрана, а не то, что iOS сообщает до
         первого поворота. */
      html, body {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--app-width);
        height: var(--app-height);
        min-width: 100%;
        min-height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #000;
        box-sizing: border-box;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      .game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--app-width);
        height: var(--app-height);
        min-width: 100%;
        min-height: 100%;
        overflow: hidden;
      }

      /* Невидимый зонд — через него читаем реальные env(safe-area-inset-*)
         и отдаём их в Unity в компонент WebSafeArea. */
      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.5); }
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.25s ease;
      }

      #unity-canvas {
        width: var(--app-width) !important;
        height: var(--app-height) !important;
        min-width: 100%;
        min-height: 100%;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        object-fit: fill;
      }
    </style>

    <script>
      // Ссылка на запущенный Unity — заполняется ниже, после createUnityInstance.
      window.__unityInstance = null;

      var __lastW = 0;
      var __lastH = 0;
      var __settleUntil = 0;

      // Игра открыта с домашнего экрана (PWA) или в полноэкранном режиме?
      function isStandaloneApp() {
        if (window.navigator.standalone === true) return true;
        if (!window.matchMedia) return false;

        return window.matchMedia('(display-mode: standalone)').matches ||
               window.matchMedia('(display-mode: fullscreen)').matches ||
               window.matchMedia('(display-mode: minimal-ui)').matches;
      }

      // ВАЖНО: ориентацию нельзя определять через innerWidth/innerHeight —
      // сразу после поворота iOS отдаёт старые значения.
      function isPortraitNow() {
        if (window.screen && screen.orientation && typeof screen.orientation.angle === 'number') {
          return (Math.abs(screen.orientation.angle) % 180) === 0;
        }

        if (typeof window.orientation === 'number') {
          return Math.abs(window.orientation) !== 90;
        }

        return window.innerHeight >= window.innerWidth;
      }

      // ГЛАВНОЕ ИСПРАВЛЕНИЕ: в PWA берём размер ФИЗИЧЕСКОГО экрана, а не
      // window.innerHeight. На первом запуске iOS сообщает высоту без зоны
      // домашней полоски, и именно поэтому снизу висела чёрная полоса,
      // которая пропадала только после переворота.
      function computeSize() {
        var w = window.innerWidth;
        var h = window.innerHeight;

        if (!isStandaloneApp()) {
          // Обычная вкладка Safari: там панели браузера реально съедают экран.
          var vv = window.visualViewport;
          if (vv) h = vv.height;
          return { w: w, h: h };
        }

        if (window.screen && screen.width && screen.height) {
          var shortSide = Math.min(screen.width, screen.height);
          var longSide = Math.max(screen.width, screen.height);
          var portrait = isPortraitNow();

          var sw = portrait ? shortSide : longSide;
          var sh = portrait ? longSide : shortSide;

          if (sw > w) w = sw;
          if (sh > h) h = sh;
        }

        return { w: w, h: h };
      }

      function applySize() {
        var size = computeSize();

        if (size.w <= 0 || size.h <= 0) return false;

        var root = document.documentElement;
        root.style.setProperty('--app-width', size.w + 'px');
        root.style.setProperty('--app-height', size.h + 'px');

        var changed = (size.w !== __lastW || size.h !== __lastH);
        __lastW = size.w;
        __lastH = size.h;

        return changed;
      }

      // Пинок Safari: без принудительного пересчёта он держит старый viewport
      // до первого поворота экрана.
      function kickRelayout() {
        var root = document.documentElement;
        var prev = root.style.minHeight;

        root.style.minHeight = (window.innerHeight + 1) + 'px';
        void root.offsetHeight;
        root.style.minHeight = prev;

        window.scrollTo(0, 1);
        window.scrollTo(0, 0);
      }

      function readSafeAreaInsets() {
        var probe = document.getElementById('safe-probe');
        if (!probe || !window.getComputedStyle) return null;

        var cs = window.getComputedStyle(probe);

        return {
          top: parseFloat(cs.paddingTop) || 0,
          bottom: parseFloat(cs.paddingBottom) || 0,
          left: parseFloat(cs.paddingLeft) || 0,
          right: parseFloat(cs.paddingRight) || 0
        };
      }

      // Отдаём безопасную зону в Unity: объект на сцене должен называться
      // ровно "WebSafeArea". Формат: "top,bottom,left,right,width,height".
      function notifyUnitySafeArea() {
        if (!window.__unityInstance) return;

        var i = readSafeAreaInsets();
        if (!i) return;

        var w = __lastW || window.innerWidth;
        var h = __lastH || window.innerHeight;

        try {
          window.__unityInstance.SendMessage(
            'WebSafeArea',
            'SetSafeAreaFromWeb',
            i.top + ',' + i.bottom + ',' + i.left + ',' + i.right + ',' + w + ',' + h);
        } catch (e) {
          // Объекта на сцене пока нет — это не ошибка.
        }
      }

      function syncNow(kick) {
        if (kick) kickRelayout();

        var changed = applySize();

        if (changed) {
          window.dispatchEvent(new Event('resize'));
        }

        notifyUnitySafeArea();
      }

      // После старта и после каждого поворота iOS отдаёт верные размеры не
      // сразу, поэтому повторяем пересчёт лесенкой и ещё несколько
      // секунд сторожим таймером.
      function refreshViewport() {
        __settleUntil = Date.now() + 6000;

        var delays = [0, 50, 120, 250, 400, 650, 900, 1400, 2200, 3200];

        for (var i = 0; i < delays.length; i++) {
          (function (d) {
            setTimeout(function () { syncNow(d <= 900); }, d);
          })(delays[i]);
        }
      }

      setInterval(function () {
        if (Date.now() > __settleUntil) {
          // Вне окна устаканивания всё равно дешёво сверяем размер.
          syncNow(false);
          return;
        }

        syncNow(false);
      }, 250);

      window.addEventListener('resize', function () { applySize(); });
      window.addEventListener('orientationchange', refreshViewport);
      window.addEventListener('pageshow', refreshViewport);
      window.addEventListener('focus', refreshViewport);
      document.addEventListener('DOMContentLoaded', refreshViewport);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refreshViewport();
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { applySize(); });
        window.visualViewport.addEventListener('scroll', function () { window.scrollTo(0, 0); });
      }

      if (window.screen && screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener('change', refreshViewport);
      }

      applySize();
    </script>
  </head>

  <body>
    <div id="safe-probe"></div>

    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var config = {
        dataUrl: "Build/Peasd Ariky.data.unityweb",
        frameworkUrl: "Build/Peasd Ariky.framework.js.unityweb",
        codeUrl: "Build/Peasd Ariky.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.4",
        matchWebGLToCanvasSize: true,
      };

      refreshViewport();

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {
        window.__unityInstance = unityInstance;

        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        refreshViewport();

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
