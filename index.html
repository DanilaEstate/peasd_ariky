<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Peast Ariky</title>
    <style>
      html, body {
        width: 100%; height: 100%; padding: 0; margin: 0;
        overflow: hidden; background-color: #000;
      }

      /* Слой фона теперь полностью независим */
      .bg-img {
        position: fixed; /* Фиксируем намертво */
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 1;
        animation: zoomEffect 30s linear forwards;
        will-change: transform; /* Подсказка браузеру для плавной работы */
        transition: opacity 0.5s ease;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.3); }
      }

      /* Контейнер для игры теперь отдельно */
      .game-container {
        position: absolute;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: 2;
      }

      #loader-wrapper {
        position: absolute; top: 50%; left: 25%; width: 50%;
        height: 60px; background: rgba(0, 0, 0, 0.3);
        border-radius: 15px; overflow: hidden; z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%; height: 100%; background: #8a00ff; transition: width 0.3s ease;
      }

      #unity-canvas {
        width: 100vw !important; height: 100vh !important;
        display: block; object-fit: fill;
      }
    </style>
  </head>
  <body>
    <img src="Build/Peast Ariky.jpg" class="bg-img">
    
    <div class="game-container">
      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peast Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");
      var config = { /* ... твой конфиг ... */ };

      createUnityInstance(canvas, config, (progress) => {
          progressBar.style.width = Math.floor(progress * 100) + "%";
      }).then((unityInstance) => {
          var bg = document.querySelector('.bg-img');
          var loader = document.querySelector('#loader-wrapper');
          
          // Фиксируем текущее состояние
          bg.style.transform = 'scale(1.3)';
          bg.style.animation = 'none';
          
          // Растворяем
          bg.style.opacity = '0';
          loader.style.opacity = '0';
          
          setTimeout(() => {
              bg.remove(); // Полностью удаляем из DOM
              loader.remove();
          }, 500);
      }).catch((message) => { alert(message); });
    </script>
  </body>
</html>
