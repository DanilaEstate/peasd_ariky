<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      body {
        position: fixed;
        inset: 0;
      }

      :root {
        --safe-top: env(safe-area-inset-top);
      }

      .game-container {
        position: fixed;
        inset: 0;
        background: black;

        /* ВАЖНО: только верхний отступ */
        padding-top: var(--safe-top);
      }

      #unity-canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
        z-index: 2;
      }

      .bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0,0,0,0.3);
        border-radius: 15px;
        transform: translateY(-50%);
        z-index: 3;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
      }

      /* ПОРТРЕТ: гарантируем что canvas не уедет вниз */
      @media (orientation: portrait) {
        .game-container {
          padding-top: env(safe-area-inset-top);
        }
      }
    </style>
  </head>

  <body>
    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const progressBar = document.querySelector("#progress-bar");

      const config = {
        dataUrl: "Build/Peasd Ariky.data",
        frameworkUrl: "Build/Peasd Ariky.framework.js",
        codeUrl: "Build/Peasd Ariky.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.3",
      };

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";
        if (progress >= 1) progressBar.style.opacity = "0";
      }).then(() => {
        document.querySelector(".bg-img").remove();
        document.querySelector("#loader-wrapper").remove();
      });
    </script>
  </body>
</html>
