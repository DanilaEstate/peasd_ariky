<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            background-color: #000;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            overscroll-behavior: none; 
            touch-action: none; 
        }

        .game-container {
            position: absolute;
            top: 0; 
            left: 0; 
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            display: block;
        }

        .bg-img {
            position: absolute;
            bottom: 0; /* Прижимаем превью к низу */
            left: 0;
            width: 100%; 
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transform-origin: left bottom; /* Сдвигаем точку анимации вниз */
            transition: opacity 0.5s ease;
            animation: zoomEffect 30s linear forwards;
            will-change: transform;
        }

        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            /* ХАК: Убираем привязку к верху и жестко крепим к низу */
            bottom: 0 !important; 
            left: 0;
            z-index: 2;
            display: block;
        }

        @keyframes zoomEffect {
            from { transform: scale(1); }
            to { transform: scale(1.8); }
        }

        #loader-wrapper {
            position: absolute; top: 50%; left: 25%; width: 50%;
            height: 60px; background: rgba(0, 0, 0, 0.3);
            border-radius: 15px; overflow: hidden; z-index: 3;
            transform: translateY(-50%);
        }

        #progress-bar {
            width: 0%; height: 100%; background: #8a00ff; transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <img src="Preview.png" class="bg-img">
        <div id="loader-wrapper">
            <div id="progress-bar"></div>
        </div>
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var progressBar = document.querySelector("#progress-bar");
        var container = document.querySelector(".game-container");

        function fixGeometry() {
            window.scrollTo(0, 0);
        }

        window.addEventListener('resize', fixGeometry);
        window.addEventListener('orientationchange', () => setTimeout(fixGeometry, 200));

        var config = {
            dataUrl: "Build/Peasd Ariky.data",
            frameworkUrl: "Build/Peasd Ariky.framework.js",
            codeUrl: "Build/Peasd Ariky.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DeshaCompany",
            productName: "Peasd Ariky",
            productVersion: "0.3",
            
            // Пытаемся адаптировать разрешение к размеру контейнера
            matchWebGLToCanvasSize: true, 
            devicePixelRatio: Math.min(window.devicePixelRatio, 2)
        };

        fixGeometry();

        createUnityInstance(canvas, config, (progress) => {
            progressBar.style.width = Math.floor(progress * 100) + "%";
            if (progress >= 1.0) {
                var loader = document.querySelector('#loader-wrapper');
                if(loader) loader.style.opacity = '0';
            }
        }).then((unityInstance) => {
            var bg = document.querySelector('.bg-img');
            var loader = document.querySelector('#loader-wrapper');
            
            fixGeometry();
            if(bg) bg.style.opacity = '0';
            
            window.focus();
            canvas.focus();
            
            setTimeout(() => {
                if(bg) bg.remove();
                if(loader) loader.remove();
            }, 500);
        }).catch((message) => { 
            alert("Ошибка загрузки: " + message); 
        });

        fixGeometry();
        document.addEventListener("DOMContentLoaded", fixGeometry);
    </script>
</body>
</html>
