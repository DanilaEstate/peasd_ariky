<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Peasd Ariky</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-style" content="black-translucent">

    <style>
      html, body {
        width: 100%;
        height: var(--app-height);
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #000;
        box-sizing: border-box;
        /* ДОБАВЛЕНО: запрещаем Safari обрабатывать жесты (скролл/пинч/
           двойной тап) на самой странице — это убирает лишние resize/scroll
           события во время игры, которые могли триггерить пересчёт canvas. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      body {
        margin: 0;
        height: var(--app-height);
        overflow: hidden;
        background: black;
      }

      .game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--app-height);
        overflow: hidden;
        touch-action: none;
      }

      .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.5); }
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.25s ease;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        object-fit: fill;
        touch-action: none;
        /* ДОБАВЛЕНО: рендерим в пониженном разрешении (см. devicePixelRatio
           ниже), но растягиваем БЕЗ сглаживания — чёткие пиксельные края
           вместо блюра при апскейле. Для пиксель-арта это именно то, что
           нужно, и никакого "мыла" не даёт — наоборот, убирает его. */
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
    </style>

    <script>
      function setAppHeight() {
        const vv = window.visualViewport;
        const height = vv ? vv.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', height + 'px');
      }

      // ДОБАВЛЕНО: на iOS Safari тулбар/адресная строка скрывается и
      // появляется при скролле/тапах, и это шлёт visualViewport.resize
      // ОЧЕНЬ часто (иногда по несколько раз в секунду во время анимации
      // панели). Каждое такое срабатывание меняло реальный CSS-размер
      // канваса, а Unity внутри себя реагирует на изменение размера канваса
      // пересозданием WebGL render target — тяжёлая операция, которая
      // прямо во время геймплея вызывала подлагивания, которые не видны в
      // счётчике FPS. Теперь: (1) игнорируем колебания высоты меньше 30px
      // (это как раз диапазон анимации тулбара Safari, а не настоящий
      // ресайз/поворот экрана), и (2) добавляем небольшой дебаунс, чтобы не
      // реагировать на каждое из множества событий подряд, а только на
      // финальное значение после того, как анимация панели закончилась.
      let lastAppHeight = 0;
      let appHeightDebounce = null;

      function applyAppHeight() {
        const vv = window.visualViewport;
        const height = Math.round(vv ? vv.height : window.innerHeight);

        if (Math.abs(height - lastAppHeight) < 30) return;
        lastAppHeight = height;

        document.documentElement.style.setProperty('--app-height', height + 'px');
      }

      function scheduleAppHeight() {
        clearTimeout(appHeightDebounce);
        appHeightDebounce = setTimeout(applyAppHeight, 150);
      }

      window.addEventListener('resize', scheduleAppHeight);
      window.addEventListener('orientationchange', scheduleAppHeight);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleAppHeight);
      }

      applyAppHeight();
    </script>
  </head>

  <body>
    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      // ДОБАВЛЕНО: ограничиваем реальное разрешение рендера. На iPhone
      // devicePixelRatio = 3 — Unity рендерил бы в 3x по каждой оси
      // (x9 нагрузки на fill rate GPU по сравнению с 1x). Для пиксель-арт
      // платформера такая точность не нужна, а картинка всё равно
      // остаётся чёткой благодаря image-rendering: pixelated на канвасе
      // выше — увеличение идёт без сглаживания.
      // Если на десктопе/более мощных устройствах видно, что чёткости не
      // хватает — можно поднять до 2.5, здесь 2 выбрано как безопасный
      // компромисс именно под iPhone.
      var cappedPixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      var config = {
        dataUrl: "Build/Peasd Ariky.data",
        frameworkUrl: "Build/Peasd Ariky.framework.js",
        codeUrl: "Build/Peasd Ariky.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.4",
        devicePixelRatio: cappedPixelRatio,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {
        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        window.dispatchEvent(new Event('resize'));

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
