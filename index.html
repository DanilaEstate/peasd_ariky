<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>Peasd Ariky</title>

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: var(--app-height);

    overflow: hidden;
    background: #000;

    position: relative;

    overscroll-behavior: none;
    touch-action: none;
}

.game-container {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: var(--app-height);

    overflow: hidden;
    background: #000;
}

.bg-img {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    /* ключевой момент */

    transform: scale(1.7);

    transform-origin: left center;

    /* чтобы не было смещения из-за subpixel */

    will-change: transform;

    z-index: 1;

    transition: opacity 0.5s ease;

}

#unity-canvas {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: block;

    background: #000;

    z-index: 2;
}

#loader-wrapper {
    position: absolute;

    top: 50%;
    left: 25%;

    width: 50%;
    height: 60px;

    transform: translateY(-50%);

    background: rgba(0,0,0,0.3);

    border-radius: 15px;

    overflow: hidden;

    z-index: 3;
}

#progress-bar {
    width: 0%;
    height: 100%;

    background: #8a00ff;

    transition: width 0.3s ease;
}

</style>
</head>

<body>

<div class="game-container">

    <img src="Preview.png" class="bg-img">

    <div id="loader-wrapper">
        <div id="progress-bar"></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

</div>

<script src="Build/Peasd Ariky.loader.js"></script>

<script>

const canvas = document.querySelector("#unity-canvas");
const progressBar = document.querySelector("#progress-bar");

/* ---------------- REAL iOS HEIGHT FIX ---------------- */

function setAppHeight() {

    const height =
        window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;

    document.documentElement.style.setProperty(
        '--app-height',
        height + 'px'
    );
}

setAppHeight();

/* важно */
window.addEventListener('resize', setAppHeight);

window.addEventListener('orientationchange', () => {

    setTimeout(setAppHeight, 50);
    setTimeout(setAppHeight, 200);
    setTimeout(setAppHeight, 500);

});

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        'resize',
        setAppHeight
    );

}

/* ---------------- canvas resize ---------------- */

function resizeCanvas() {

    const width =
        window.visualViewport
            ? window.visualViewport.width
            : window.innerWidth;

    const height =
        window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;

    const dpr = window.devicePixelRatio || 1;

    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
}

resizeCanvas();

window.addEventListener('resize', resizeCanvas);

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        'resize',
        resizeCanvas
    );

}

/* ---------------- unity ---------------- */

const config = {

    dataUrl: "Build/Peasd Ariky.data",

    frameworkUrl: "Build/Peasd Ariky.framework.js",

    codeUrl: "Build/Peasd Ariky.wasm",

    streamingAssetsUrl: "StreamingAssets",

    companyName: "DeshaCompany",

    productName: "Peasd Ariky",

    productVersion: "0.3",

    matchWebGLToCanvasSize: true,

    devicePixelRatio: window.devicePixelRatio || 1
};

createUnityInstance(canvas, config, (progress) => {

    progressBar.style.width =
        Math.floor(progress * 100) + "%";

}).then(() => {

    const bg =
        document.querySelector(".bg-img");

    const loader =
        document.querySelector("#loader-wrapper");

    if (bg)
        bg.style.opacity = "0";

    setTimeout(() => {

        if (bg) bg.remove();
        if (loader) loader.remove();

    }, 500);

});

</script>

</body>
</html>
