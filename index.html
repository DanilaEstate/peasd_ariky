<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- ИСПРАВЛЕНО (v7): канонический вид тега из документации Apple.
         Убран height=device-height — именно из-за него iOS часто игнорирует
         viewport-fit=cover, и тогда layout viewport заканчивается выше домашней
         полоски, а всё, что ниже, ОБРЕЗАЕТСЯ (та самая чёрная полоса). -->
    <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <title>Peasd Ariky</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
      :root {
        --app-height: 100%;
      }

      /* Высота задаётся лесенкой единиц: браузер возьмёт самую последнюю,
         которую понимает. lvh — «большой» viewport, то есть вся высота
         экрана без оглядки на системные полосы. */
      html, body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        height: 100lvh;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #000;
        box-sizing: border-box;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      .game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        width: 100vw;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        height: 100lvh;
        overflow: hidden;
      }

      /* Только в обычной вкладке Safari высота берётся из скрипта:
         там панели браузера реально съедают экран. В PWA класса нет. */
      body.browser-mode .game-container,
      body.browser-mode #unity-canvas {
        height: var(--app-height);
      }

      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      #debug-panel {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 99;
        display: none;
        margin: 0;
        padding: 6px 8px;
        max-width: 100%;
        font: 11px/1.35 monospace;
        color: #0f0;
        background: rgba(0, 0, 0, 0.7);
        white-space: pre;
        pointer-events: none;
      }

      body.debug-on #debug-panel {
        display: block;
      }

      .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.5); }
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.25s ease;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        height: 100vh !important;
        height: 100dvh !important;
        height: 100lvh !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        object-fit: fill;
      }
    </style>

    <script>
      var APP_VERSION = 'v7';

      window.__unityInstance = null;

      var __lastH = 0;

      function isStandaloneApp() {
        if (window.navigator.standalone === true) return true;
        if (!window.matchMedia) return false;

        return window.matchMedia('(display-mode: standalone)').matches ||
               window.matchMedia('(display-mode: fullscreen)').matches ||
               window.matchMedia('(display-mode: minimal-ui)').matches;
      }

      function readSafeAreaInsets() {
        var probe = document.getElementById('safe-probe');
        if (!probe || !window.getComputedStyle) return null;

        var cs = window.getComputedStyle(probe);

        return {
          top: parseFloat(cs.paddingTop) || 0,
          bottom: parseFloat(cs.paddingBottom) || 0,
          left: parseFloat(cs.paddingLeft) || 0,
          right: parseFloat(cs.paddingRight) || 0
        };
      }

      // env(safe-area-inset-*) отличается от нуля ТОЛЬКО когда работает
      // viewport-fit=cover. Поэтому это точный детектор безрамочного режима.
      function isCoverActive() {
        var i = readSafeAreaInsets();
        if (!i) return false;

        return (i.top > 0 || i.bottom > 0 || i.left > 0 || i.right > 0);
      }

      function screenCssSize() {
        if (!window.screen || !screen.width || !screen.height) {
          return { w: window.innerWidth, h: window.innerHeight };
        }

        var shortSide = Math.min(screen.width, screen.height);
        var longSide = Math.max(screen.width, screen.height);

        var portrait;

        if (screen.orientation && typeof screen.orientation.angle === 'number') {
          portrait = (Math.abs(screen.orientation.angle) % 180) === 0;
        } else if (typeof window.orientation === 'number') {
          portrait = Math.abs(window.orientation) !== 90;
        } else {
          portrait = window.innerHeight >= window.innerWidth;
        }

        return portrait ? { w: shortSide, h: longSide } : { w: longSide, h: shortSide };
      }

      // Перечитка meta viewport — то же самое, что делал физический поворот
      // экрана. Нужна только пока cover не включился.
      var VIEWPORT_BASE = 'width=device-width, user-scalable=no, viewport-fit=cover';

      function setViewport(scale) {
        var meta = document.getElementById('viewport-meta');
        if (!meta) return;

        meta.setAttribute(
          'content',
          VIEWPORT_BASE +
            ', initial-scale=' + scale +
            ', minimum-scale=' + scale +
            ', maximum-scale=' + scale);
      }

      function nudgeViewport() {
        if (isCoverActive()) return;

        setViewport('1.0001');

        setTimeout(function () {
          setViewport('1');
          window.scrollTo(0, 0);
        }, 40);
      }

      function applySize() {
        var standalone = isStandaloneApp();

        if (document.body) {
          if (standalone) document.body.classList.remove('browser-mode');
          else document.body.classList.add('browser-mode');
        }

        if (standalone) {
          document.documentElement.style.setProperty('--app-height', '100%');
          return false;
        }

        var vv = window.visualViewport;
        var h = vv ? vv.height : window.innerHeight;

        document.documentElement.style.setProperty('--app-height', h + 'px');

        var changed = (h !== __lastH);
        __lastH = h;

        return changed;
      }

      // Отдаём безопасную зону в Unity. Объект на сцене — ровно "WebSafeArea".
      // Формат: "top,bottom,left,right,width,height".
      function notifyUnitySafeArea() {
        if (!window.__unityInstance) return;

        var i = readSafeAreaInsets();
        if (!i) return;

        try {
          window.__unityInstance.SendMessage(
            'WebSafeArea',
            'SetSafeAreaFromWeb',
            i.top + ',' + i.bottom + ',' + i.left + ',' + i.right +
              ',' + window.innerWidth + ',' + window.innerHeight);
        } catch (e) {
          // Объекта на сцене пока нет — это не ошибка.
        }
      }

      function updateDebugPanel() {
        var panel = document.getElementById('debug-panel');
        if (!panel || !document.body) return;
        if (!document.body.classList.contains('debug-on')) return;

        var i = readSafeAreaInsets() || { top: 0, bottom: 0, left: 0, right: 0 };
        var s = screenCssSize();
        var vv = window.visualViewport;
        var cvs = document.getElementById('unity-canvas');
        var cover = isCoverActive();

        panel.textContent =
          APP_VERSION + '  cover: ' + (cover ? 'ON' : 'OFF') + '\n' +
          'standalone: ' + isStandaloneApp() + '\n' +
          'inner:  ' + window.innerWidth + ' x ' + window.innerHeight + '\n' +
          'screen: ' + s.w + ' x ' + s.h + '\n' +
          'visual: ' + (vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) : 'n/a') + '\n' +
          'client: ' + document.documentElement.clientWidth + ' x ' + document.documentElement.clientHeight + '\n' +
          'canvas css: ' + (cvs ? cvs.clientWidth + ' x ' + cvs.clientHeight : 'n/a') + '\n' +
          'canvas buf: ' + (cvs ? cvs.width + ' x ' + cvs.height : 'n/a') + '\n' +
          'safe t/b/l/r: ' + i.top + ' / ' + i.bottom + ' / ' + i.left + ' / ' + i.right + '\n' +
          'dpr: ' + window.devicePixelRatio;
      }

      // Самодиагностика: если через 5 секунд после старта cover так и не
      // включился — сами показываем цифры, чтобы не гадать.
      function autoDiagnose() {
        if (!document.body) return;
        if (!isStandaloneApp()) return;
        if (isCoverActive()) return;

        var s = screenCssSize();
        if (window.innerHeight >= s.h - 1) return;

        document.body.classList.add('debug-on');
        updateDebugPanel();
      }

      function syncNow(nudge) {
        if (nudge) nudgeViewport();

        var changed = applySize();
        if (changed) window.dispatchEvent(new Event('resize'));

        notifyUnitySafeArea();
        updateDebugPanel();
      }

      function refreshViewport() {
        var nudgeAt = [0, 250, 700, 1500, 3000];

        for (var i = 0; i < nudgeAt.length; i++) {
          (function (d) {
            setTimeout(function () { syncNow(true); }, d);
          })(nudgeAt[i]);
        }

        var plainAt = [60, 150, 400, 1000, 2000, 4000];

        for (var j = 0; j < plainAt.length; j++) {
          (function (d) {
            setTimeout(function () { syncNow(false); }, d);
          })(plainAt[j]);
        }

        setTimeout(autoDiagnose, 5000);
      }

      window.addEventListener('resize', function () { syncNow(false); });
      window.addEventListener('orientationchange', refreshViewport);
      window.addEventListener('pageshow', refreshViewport);
      window.addEventListener('focus', refreshViewport);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refreshViewport();
      });

      document.addEventListener('DOMContentLoaded', function () {
        // Диагностика вручную: адрес с ?debug=1 или тройной тап в левом
        // верхнем углу.
        if (location.search.indexOf('debug=1') >= 0) {
          document.body.classList.add('debug-on');
        }

        refreshViewport();
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { syncNow(false); });
        window.visualViewport.addEventListener('scroll', function () { window.scrollTo(0, 0); });
      }

      if (window.screen && screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener('change', refreshViewport);
      }

      setInterval(function () { syncNow(false); }, 500);

      (function () {
        var taps = 0;
        var timer = null;

        window.addEventListener('touchend', function (e) {
          var t = e.changedTouches && e.changedTouches[0];
          if (!t) return;
          if (t.clientX > 90 || t.clientY > 90) return;

          taps++;

          if (timer) clearTimeout(timer);
          timer = setTimeout(function () { taps = 0; }, 600);

          if (taps >= 3) {
            taps = 0;
            document.body.classList.toggle('debug-on');
            updateDebugPanel();
          }
        }, { passive: true });
      })();
    </script>
  </head>

  <body>
    <div id="safe-probe"></div>
    <pre id="debug-panel"></pre>

    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var config = {
        dataUrl: "Build/Peasd Ariky.data.unityweb",
        frameworkUrl: "Build/Peasd Ariky.framework.js.unityweb",
        codeUrl: "Build/Peasd Ariky.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.4",
        matchWebGLToCanvasSize: true,
      };

      refreshViewport();

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {
        window.__unityInstance = unityInstance;

        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        refreshViewport();

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
