<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- Статичный viewport с viewport-fit=cover — обязательно до любого CSS и JS. -->
    <meta id="viewport-meta" name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Peasd Ariky</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
      :root {
        --app-height: 100%;
      }

      /* ОТКАЧЕНО: больше НЕ навязываем размер по screen.width/height.
         Если iOS ещё не применил viewport-fit=cover, такое принудительное
         растягивание не помогает: область ниже layout viewport просто не
         отрисовывается страницей, и полоса остаётся навсегда.
         Правильный путь — заставить Safari применить cover (см. nudgeViewport). */
      html, body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #000;
        box-sizing: border-box;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      .game-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Только в обычной вкладке Safari высота считается скриптом — там
         панели браузера реально съедают экран. В PWA класс не ставится. */
      body.browser-mode .game-container,
      body.browser-mode #unity-canvas {
        height: var(--app-height);
        bottom: auto;
      }

      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      #debug-panel {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 99;
        display: none;
        margin: 0;
        padding: 6px 8px;
        max-width: 100%;
        font: 11px/1.35 monospace;
        color: #0f0;
        background: rgba(0, 0, 0, 0.65);
        white-space: pre;
        pointer-events: none;
      }

      body.debug-on #debug-panel {
        display: block;
      }

      .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.5); }
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.25s ease;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        object-fit: fill;
      }
    </style>

    <script>
      window.__unityInstance = null;

      var __lastH = 0;

      function isStandaloneApp() {
        if (window.navigator.standalone === true) return true;
        if (!window.matchMedia) return false;

        return window.matchMedia('(display-mode: standalone)').matches ||
               window.matchMedia('(display-mode: fullscreen)').matches ||
               window.matchMedia('(display-mode: minimal-ui)').matches;
      }

      // ГЛАВНОЕ ИСПРАВЛЕНИЕ.
      //
      // Известный баг iOS: при старте PWA с black-translucent Safari раскладывает
      // страницу БЕЗ учёта viewport-fit=cover — внизу остаётся чёрная полоса
      // высотой с домашнюю полоску. Поворот экрана лечил её потому, что
      // заставлял Safari ЗАНОВО разобрать meta viewport. Здесь делаем то же
      // самое вручную: микроскопически меняем масштаб в content и возвращаем
      // обратно. Визуально это незаметно, но cover применяется сразу.
      var VIEWPORT_BASE = 'width=device-width, height=device-height, user-scalable=no, viewport-fit=cover';

      function setViewport(scale) {
        var meta = document.getElementById('viewport-meta');
        if (!meta) return;

        meta.setAttribute(
          'content',
          VIEWPORT_BASE +
            ', initial-scale=' + scale +
            ', minimum-scale=' + scale +
            ', maximum-scale=' + scale);
      }

      function nudgeViewport() {
        setViewport('1.0001');

        setTimeout(function () {
          setViewport('1.0');
          window.scrollTo(0, 0);
        }, 40);
      }

      function applySize() {
        var standalone = isStandaloneApp();

        if (document.body) {
          if (standalone) document.body.classList.remove('browser-mode');
          else document.body.classList.add('browser-mode');
        }

        if (standalone) {
          // Высоту не навязываем: CSS сам растягивается на весь layout viewport,
          // а cover делает этот viewport равным всему экрану.
          document.documentElement.style.setProperty('--app-height', '100%');
          return false;
        }

        var vv = window.visualViewport;
        var h = vv ? vv.height : window.innerHeight;

        document.documentElement.style.setProperty('--app-height', h + 'px');

        var changed = (h !== __lastH);
        __lastH = h;

        return changed;
      }

      function readSafeAreaInsets() {
        var probe = document.getElementById('safe-probe');
        if (!probe || !window.getComputedStyle) return null;

        var cs = window.getComputedStyle(probe);

        return {
          top: parseFloat(cs.paddingTop) || 0,
          bottom: parseFloat(cs.paddingBottom) || 0,
          left: parseFloat(cs.paddingLeft) || 0,
          right: parseFloat(cs.paddingRight) || 0
        };
      }

      // Отдаём безопасную зону в Unity. Объект на сцене должен называться
      // ровно "WebSafeArea". Формат: "top,bottom,left,right,width,height".
      function notifyUnitySafeArea() {
        if (!window.__unityInstance) return;

        var i = readSafeAreaInsets();
        if (!i) return;

        try {
          window.__unityInstance.SendMessage(
            'WebSafeArea',
            'SetSafeAreaFromWeb',
            i.top + ',' + i.bottom + ',' + i.left + ',' + i.right +
              ',' + window.innerWidth + ',' + window.innerHeight);
        } catch (e) {
          // Объекта на сцене пока нет — это не ошибка.
        }
      }

      function updateDebugPanel() {
        var panel = document.getElementById('debug-panel');
        if (!panel || !document.body || !document.body.classList.contains('debug-on')) return;

        var i = readSafeAreaInsets() || { top: 0, bottom: 0, left: 0, right: 0 };
        var vv = window.visualViewport;
        var cvs = document.getElementById('unity-canvas');

        panel.textContent =
          'standalone: ' + isStandaloneApp() + '\n' +
          'inner:  ' + window.innerWidth + ' x ' + window.innerHeight + '\n' +
          'screen: ' + screen.width + ' x ' + screen.height + '\n' +
          'visual: ' + (vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) : 'n/a') + '\n' +
          'client: ' + document.documentElement.clientWidth + ' x ' + document.documentElement.clientHeight + '\n' +
          'canvas css: ' + (cvs ? cvs.clientWidth + ' x ' + cvs.clientHeight : 'n/a') + '\n' +
          'canvas buf: ' + (cvs ? cvs.width + ' x ' + cvs.height : 'n/a') + '\n' +
          'safe t/b/l/r: ' + i.top + ' / ' + i.bottom + ' / ' + i.left + ' / ' + i.right + '\n' +
          'dpr: ' + window.devicePixelRatio;
      }

      function syncNow(nudge) {
        if (nudge) nudgeViewport();

        var changed = applySize();

        if (changed) window.dispatchEvent(new Event('resize'));

        notifyUnitySafeArea();
        updateDebugPanel();
      }

      // Лесенка после старта и после каждого поворота: iOS отдаёт верные
      // размеры не сразу, а nudge надёжно срабатывает только после того,
      // как страница уже отрисована.
      function refreshViewport() {
        var nudgeAt = [0, 250, 700, 1500, 3000];

        for (var i = 0; i < nudgeAt.length; i++) {
          (function (d) {
            setTimeout(function () { syncNow(true); }, d);
          })(nudgeAt[i]);
        }

        var plainAt = [60, 150, 400, 1000, 2000, 4000];

        for (var j = 0; j < plainAt.length; j++) {
          (function (d) {
            setTimeout(function () { syncNow(false); }, d);
          })(plainAt[j]);
        }
      }

      window.addEventListener('resize', function () { syncNow(false); });
      window.addEventListener('orientationchange', refreshViewport);
      window.addEventListener('pageshow', refreshViewport);
      window.addEventListener('focus', refreshViewport);
      document.addEventListener('DOMContentLoaded', function () {
        // Диагностика включается адресом ...index.html?debug=1
        // или тройным тапом по левому верхнему углу экрана.
        if (location.search.indexOf('debug=1') >= 0) {
          document.body.classList.add('debug-on');
        }

        refreshViewport();
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refreshViewport();
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { syncNow(false); });
        window.visualViewport.addEventListener('scroll', function () { window.scrollTo(0, 0); });
      }

      if (window.screen && screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener('change', refreshViewport);
      }

      setInterval(function () { syncNow(false); }, 500);

      // Тройной тап в левом верхнем углу — показать/скрыть цифры.
      (function () {
        var taps = 0;
        var timer = null;

        window.addEventListener('touchend', function (e) {
          var t = e.changedTouches && e.changedTouches[0];
          if (!t) return;
          if (t.clientX > 90 || t.clientY > 90) return;

          taps++;

          if (timer) clearTimeout(timer);
          timer = setTimeout(function () { taps = 0; }, 600);

          if (taps >= 3) {
            taps = 0;
            document.body.classList.toggle('debug-on');
            updateDebugPanel();
          }
        }, { passive: true });
      })();
    </script>
  </head>

  <body>
    <div id="safe-probe"></div>
    <pre id="debug-panel"></pre>

    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var config = {
        dataUrl: "Build/Peasd Ariky.data.unityweb",
        frameworkUrl: "Build/Peasd Ariky.framework.js.unityweb",
        codeUrl: "Build/Peasd Ariky.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.4",
        matchWebGLToCanvasSize: true,
      };

      refreshViewport();

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {
        window.__unityInstance = unityInstance;

        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        refreshViewport();

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
