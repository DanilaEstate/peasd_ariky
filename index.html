<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- ИСПРАВЛЕНО: viewport теперь статичный, а не добавляется скриптом после
         загрузки Unity. Раньше первая раскладка страницы успевала пройти БЕЗ
         viewport-fit=cover, из-за чего экран считался без безопасных зон и
         снизу оставалась чёрная полоса. height=device-height нужен, чтобы
         iOS в standalone-режиме отдавал полную высоту экрана. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Peasd Ariky</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- ИСПРАВЛЕНО: раньше здесь было apple-mobile-web-app-status-style —
         такого имени не существует, iOS его просто игнорировал, поэтому
         страница не растягивалась под системные полосы. Правильное имя
         apple-mobile-web-app-status-bar-style. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
      :root {
        /* Запасная высота на случай, если скрипт ещё не отработал. */
        --app-height: 100%;
      }

      /* ИЗМЕНЕНО: страница больше не считает высоту через visualViewport.
         На iPhone visualViewport.height не включает зону домашней полоски,
         поэтому снизу и получалась чёрная полоса. position: fixed + нулевые
         отступы со всех сторон растягивают всё ровно на весь экран и в
         портретном, и в горизонтальном режиме. */
      html, body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #000;
        box-sizing: border-box;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      .game-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* В обычной вкладке браузера (не PWA) панели Safari перекрывают экран,
         поэтому там высоту по-прежнему берём из visualViewport. Класс
         ставится скриптом ниже только в этом случае. */
      body.browser-mode .game-container,
      body.browser-mode #unity-canvas {
        height: var(--app-height);
        bottom: auto;
      }

      .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: center;
        transition: opacity 0.5s ease;
        animation: zoomEffect 30s linear forwards;
        will-change: transform;
        backface-visibility: hidden;
      }

      .paused {
        animation-play-state: paused !important;
      }

      @keyframes zoomEffect {
        from { transform: scale(1); }
        to { transform: scale(1.5); }
      }

      #loader-wrapper {
        position: absolute;
        top: 50%;
        left: 25%;
        width: 50%;
        height: 60px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        overflow: hidden;
        z-index: 3;
        transition: opacity 0.5s ease;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #8a00ff;
        transition: width 0.25s ease;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        object-fit: fill;
      }
    </style>

    <script>
      // Игра запущена с домашнего экрана (PWA) или в полноэкранном режиме?
      // Только в обычной вкладке браузера нужно подстраиваться под панели.
      function isStandaloneApp() {
        if (window.navigator.standalone === true) return true;
        if (!window.matchMedia) return false;
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.matchMedia('(display-mode: fullscreen)').matches ||
               window.matchMedia('(display-mode: minimal-ui)').matches;
      }

      function setAppHeight() {
        var standalone = isStandaloneApp();

        if (document.body) {
          if (standalone) document.body.classList.remove('browser-mode');
          else document.body.classList.add('browser-mode');
        }

        // В PWA высоту не навязываем вообще: CSS сам растягивает всё на
        // весь экран, включая зоны под статус-баром и домашней полоской.
        if (standalone) {
          document.documentElement.style.setProperty('--app-height', '100%');
          return;
        }

        var vv = window.visualViewport;
        var height = vv ? vv.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', height + 'px');
      }

      // ДОБАВЛЕНО: после поворота экрана iOS отдаёт новые размеры не сразу,
      // поэтому обновляемся несколько раз и каждый раз дёргаем resize —
      // именно по нему Unity пересчитывает размер полотна.
      function refreshViewport() {
        var delays = [0, 60, 150, 350, 700];

        for (var i = 0; i < delays.length; i++) {
          setTimeout(function () {
            window.scrollTo(0, 0);
            setAppHeight();
            window.dispatchEvent(new Event('resize'));
          }, delays[i]);
        }
      }

      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', refreshViewport);
      window.addEventListener('pageshow', refreshViewport);
      document.addEventListener('DOMContentLoaded', refreshViewport);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setAppHeight);
        window.visualViewport.addEventListener('scroll', function () {
          window.scrollTo(0, 0);
        });
      }

      if (window.screen && screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener('change', refreshViewport);
      }

      setAppHeight();
    </script>
  </head>

  <body>
    <div class="game-container">
      <img src="Preview.png" class="bg-img">

      <div id="loader-wrapper">
        <div id="progress-bar"></div>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/Peasd Ariky.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBar = document.querySelector("#progress-bar");

      var config = {
        dataUrl: "Build/Peasd Ariky.data.unityweb",
        frameworkUrl: "Build/Peasd Ariky.framework.js.unityweb",
        codeUrl: "Build/Peasd Ariky.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeshaCompany",
        productName: "Peasd Ariky",
        productVersion: "0.4",
      };

      // ИЗМЕНЕНО: meta viewport больше здесь не создаётся — он стоит статично
      // в head, чтобы первая же раскладка шла с viewport-fit=cover.
      refreshViewport();

      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = Math.floor(progress * 100) + "%";

        if (progress >= 1.0) {
          progressBar.style.opacity = '0';
        }
      }).then((unityInstance) => {
        var bg = document.querySelector('.bg-img');
        var loader = document.querySelector('#loader-wrapper');

        bg.style.opacity = '0';
        loader.style.opacity = '0';

        window.focus();
        canvas.focus();

        refreshViewport();

        setTimeout(() => {
          bg.remove();
          loader.remove();
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
